<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Argati">
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1517" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Argati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --paper:#EEF1EF; --surface:#FFFFFF; --sunk:#E3E8E6; --ink:#1B2226; --steel:#5C6A70; --hair:#D3DAD8;
  --flame:#FF4D0D; --flame-ink:#C53A07; --flame-wash:#FFE9E0;
  --ok:#16794C; --ok-wash:#E1F2E9; --wait:#996100; --wait-wash:#FBEFD9;
  --manual:#2F55A4; --manual-wash:#E4EBF8; --stop:#B3261E; --stop-wash:#F8E3E1;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,sans-serif;
  --r-panel:18px; --r-ctl:11px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F1517; --surface:#172024; --sunk:#1F2A2F; --ink:#E6ECEA; --steel:#93A2A8; --hair:#28343A;
    --flame:#FF6A33; --flame-ink:#FF8A5C; --flame-wash:#3A1D12;
    --ok:#4CC28A; --ok-wash:#123124; --wait:#E3A23B; --wait-wash:#33260F;
    --manual:#7FA2EC; --manual-wash:#18243F; --stop:#F2766D; --stop-wash:#3A1715;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
html,body{overflow:hidden;overscroll-behavior:none}
body{height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--font);
  -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
#view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.wrap{max-width:640px;margin:0 auto;padding:6px 18px 28px}

/* ── Top bar ─────────────────────────────────────────── */
.top{display:flex;align-items:center;gap:12px;padding:14px 0 6px}
.brand{font:700 21px/1 var(--display);letter-spacing:.2px}
.brand small{display:block;font:500 13px/1.2 var(--font);color:var(--steel);letter-spacing:0;margin-top:3px}
.runner{margin-left:auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 10px;
  border-radius:999px;background:var(--surface);border:1px solid var(--hair);font-weight:500;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--steel)}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px var(--ok-wash)}
.dot.off{background:var(--stop);box-shadow:0 0 0 4px var(--stop-wash)}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--steel);font-size:20px}
.icon-btn:active{background:var(--sunk)}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Hero: the status sentence + countdown track ─────── */
.hero{padding:22px 0 18px}
.headline{font:700 clamp(30px,8.4vw,40px)/1.04 var(--display);letter-spacing:-.2px;max-width:16ch}
.headline.attn{color:var(--flame-ink)}
.headline.bad{color:var(--stop)}
.sub{margin-top:8px;color:var(--steel);font-size:16px}
.sub b{color:var(--ink);font-weight:600}
.track{display:flex;gap:10px;overflow-x:auto;margin:18px -18px 0;padding:2px 18px 6px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.tick{flex:0 0 auto;text-align:left;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;
  background:var(--surface);border:1px solid var(--hair);min-height:52px}
.ring{--p:0;width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:conic-gradient(var(--wait) calc(var(--p)*1%),var(--wait-wash) 0)}
.ring::after{content:"";width:28px;height:28px;border-radius:50%;background:var(--surface);grid-area:1/1}
.ring span{grid-area:1/1;z-index:1;font:700 11px/1 var(--display)}
.tick .who{font-weight:600;font-size:15px;line-height:1.15}
.tick .what{font-size:13px;color:var(--steel)}

/* ── Banners ─────────────────────────────────────────── */
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin:4px 0 14px;font-size:15px}
.banner i{font-size:20px;margin-top:1px}
.banner.bad{background:var(--stop-wash);color:var(--stop)}
.banner.warn{background:var(--wait-wash);color:var(--wait)}
.banner b{font-weight:600}
.banner button{margin-left:auto;font-weight:600;text-decoration:underline;white-space:nowrap}

/* ── Sections + rows ─────────────────────────────────── */
.section{margin-top:22px}
.section h2{font:600 17px/1.2 var(--font);display:flex;align-items:baseline;gap:8px;margin:0 2px 10px}
.section h2 .count{font:600 15px/1 var(--display);color:var(--steel)}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-panel);overflow:hidden}
.row{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 14px 14px 18px;
  border-top:1px solid var(--hair);min-height:64px}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--rule,var(--hair))}
.row:active{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;font-size:16px;line-height:1.2;display:flex;gap:8px;align-items:center}
.row .line2{font-size:14px;color:var(--steel);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .why{font-size:14px;margin-top:5px;color:var(--ink);line-height:1.3}
.code{font:600 13px/1 var(--display);letter-spacing:.3px;color:var(--steel);padding:3px 6px;border-radius:5px;background:var(--sunk)}
.t-flame{--rule:var(--flame)} .t-stop{--rule:var(--stop)} .t-manual{--rule:var(--manual)}
.t-wait{--rule:var(--wait)} .t-ok{--rule:var(--ok)} .t-steel{--rule:var(--hair)}
.state{font-size:13px;font-weight:600}
.t-flame .state{color:var(--flame-ink)} .t-stop .state{color:var(--stop)} .t-manual .state{color:var(--manual)}
.t-wait .state{color:var(--wait)} .t-ok .state{color:var(--ok)} .t-steel .state{color:var(--steel)}
.chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--ok-wash);color:var(--ok)}
.btn{height:40px;padding:0 14px;border-radius:var(--r-ctl);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--flame);color:#fff}
.btn.primary:active{filter:brightness(.92)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.block{width:100%;height:48px;font-size:16px}
.btn[disabled]{opacity:.5;pointer-events:none}
.empty{padding:22px 18px;color:var(--steel);font-size:15px}
.empty b{display:block;color:var(--ink);font-weight:600;font-size:16px;margin-bottom:2px}

/* ── Placed list ─────────────────────────────────────── */
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--hair);margin:18px 0 6px}
.search i{color:var(--steel);font-size:19px}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0}
.day{font:600 15px/1 var(--font);color:var(--steel);margin:20px 2px 8px;display:flex;justify-content:space-between}
.day span:last-child{font-family:var(--display)}
.prow{display:flex;gap:12px;padding:13px 14px;border-top:1px solid var(--hair);align-items:center}
.prow:first-child{border-top:0}
.prow .main{flex:1;min-width:0}
.prow .name{font-weight:600;line-height:1.2}
.prow .line2{font-size:14px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .right{text-align:right}
.oid{font:600 15px/1.2 var(--display);letter-spacing:.2px;padding:2px 0}
.prow .total{font-size:14px;color:var(--steel)}

/* ── Insights ────────────────────────────────────────── */
.figures{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px}
.fig{padding:4px 12px 4px 0}
.fig+.fig{border-left:1px solid var(--hair);padding-left:14px}
.fig .k{font-size:14px;color:var(--steel)}
.fig .v{font:700 30px/1.05 var(--display);margin-top:4px}
.fig .m{font-size:14px;color:var(--steel);margin-top:2px}
.chart{padding:16px 14px 10px}
.chart svg{display:block;width:100%;height:auto}
.chart .axis{font:500 11px var(--font);fill:var(--steel)}
.bars .item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:11px 14px;border-top:1px solid var(--hair);align-items:center}
.bars .item:first-child{border-top:0}
.bars .label{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .val{font:600 15px/1 var(--display)}
.bars .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--steel);border-radius:3px}
.bars .item:first-child .bar i{background:var(--flame)}
.note{font-size:13px;color:var(--steel);margin:10px 2px 0}

/* ── Settings ────────────────────────────────────────── */
.setting{display:flex;gap:12px;align-items:center;padding:14px;border-top:1px solid var(--hair);min-height:60px}
.setting:first-child{border-top:0}
.setting .main{flex:1;min-width:0}
.setting .t{font-weight:600}
.setting .d{font-size:14px;color:var(--steel);margin-top:1px}
.field{display:block;padding:12px 14px;border-top:1px solid var(--hair)}
.field:first-child{border-top:0}
.field span{display:block;font-size:14px;color:var(--steel);margin-bottom:6px}
.field input{width:100%;height:44px;border-radius:10px;border:1px solid var(--hair);background:var(--paper);padding:0 12px;font-size:16px}
.field input:focus{outline:2px solid var(--flame);outline-offset:-1px}
.switch{position:relative;width:52px;height:32px;flex:0 0 auto}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:1}
.switch .tr{position:absolute;inset:0;border-radius:999px;background:var(--sunk);border:1px solid var(--hair);transition:background .2s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+.tr{background:var(--ok);border-color:var(--ok)}
.switch input:checked+.tr::after{transform:translateX(20px)}
.switch input:focus-visible+.tr{outline:2px solid var(--flame);outline-offset:2px}

/* ── Tab bar ─────────────────────────────────────────── */
.tabs{flex:0 0 auto;position:relative;z-index:20;background:var(--paper);border-top:1px solid var(--hair);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0))}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--steel);position:relative}
.tab i{font-size:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] i{color:var(--flame)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--flame);color:#fff;font:700 11px/18px var(--display);text-align:center}

/* ── Sheet (details) ─────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,15,17,.42);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;background:var(--surface);
  border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0));max-height:88vh;overflow-y:auto;
  transform:translateY(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s}
.sheet.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--hair);margin:0 auto 14px}
.sheet h3{font:700 26px/1.1 var(--display);padding-right:44px}
.sheet .close{position:absolute;top:14px;right:12px}
.sheet .prod{margin-top:6px;font-size:16px;color:var(--steel)}
.status-box{margin:16px 0;padding:12px 14px;border-radius:14px;background:var(--sunk)}
.status-box .state{font-size:14px}
.status-box p{margin-top:3px;font-size:15px}
.t-flame.status-box{background:var(--flame-wash)} .t-stop.status-box{background:var(--stop-wash)}
.t-manual.status-box{background:var(--manual-wash)} .t-wait.status-box{background:var(--wait-wash)} .t-ok.status-box{background:var(--ok-wash)}
.facts{display:grid;gap:0;border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.fact{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--hair);text-decoration:none}
.fact:first-child{border-top:0}
.fact i{font-size:20px;color:var(--steel)}
.fact .k{font-size:13px;color:var(--steel)}
.fact .v{font-size:16px;word-break:break-word}
.actions{display:grid;gap:10px;margin-top:16px}
.warnline{font-size:14px;color:var(--stop);margin-top:-2px}

/* ── Toast + setup ───────────────────────────────────── */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0));transform:translate(-50%,20px);z-index:60;
  background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:15px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 36px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.setup{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:440px;margin:0 auto;padding:24px 22px}
.setup h1{font:700 40px/1.02 var(--display)}
.setup p{color:var(--steel);margin:10px 0 22px;font-size:16px}
.setup .err{color:var(--stop);font-size:15px;margin-top:10px;min-height:22px}
.setup .alt{margin-top:16px;font-size:15px;color:var(--steel);text-align:center}
.setup .alt a{color:var(--ink);font-weight:600}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){.wrap{padding-top:10px}.headline{max-width:20ch}}
</style>
</head>
<body>
<div id="app"><main id="view"><div id="content"></div></main><div class="tabs" id="tabs" hidden></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// ── Config ─────────────────────────────────────────────────────────────────
const APP_VERSION = '3.0.1';
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbzQMxhghzC2LCW36uaUJTlOI4WxHV6h8snnhRPRBgSM6fXeyG8LZS67Pzxoet41wes/exec';
const VAPID_PUBLIC = 'BPMuB6Ef73ZeI70auGOSVXz1DUz5GW2CDCzh0S-ecMFiyrhjVQv6OyF48qm-Kd_tKeyBqj7E1ZrYYHpR7KtKeuQ';
const QUIET_MS = 120000, POLL_MS = 10000;
const DEMO = new URLSearchParams(location.search).has('demo');
const store = {
  get() { try { return JSON.parse(localStorage.getItem('argati.v3') || '{}'); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem('argati.v3', JSON.stringify(v)); } catch (e) {} }
};
let cfg = Object.assign({ url: DEFAULT_URL, key: '' }, store.get());

const S = { tab: 'queue', status: null, pending: null, recent: [], recentAt: 0, offset: 0, lastOk: 0,
            error: '', loading: false, approved: {}, open: null, query: '' };

const STATES = {
  review:      { label: 'Needs approval',      tone: 'flame',  group: 'needs' },
  unverified:  { label: 'Check back office',   tone: 'stop',   group: 'needs' },
  manual:      { label: 'Place manually',      tone: 'manual', group: 'needs' },
  blocked:     { label: 'Fix in the sheet',    tone: 'stop',   group: 'needs' },
  waiting:     { label: 'Counting down',       tone: 'wait',   group: 'soon' },
  retry:       { label: 'Retrying',            tone: 'wait',   group: 'soon' },
  ready:       { label: 'Ready to place',      tone: 'ok',     group: 'soon' },
  would_place: { label: 'Would place (test mode)', tone: 'ok', group: 'soon' },
  writing:     { label: 'Writing to the sheet', tone: 'ok',    group: 'soon' },
  placed:      { label: 'Placed',              tone: 'ok',     group: 'soon' },
  unknown:     { label: 'Not checked yet',     tone: 'steel',  group: 'soon' },
};

// ── Helpers ────────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '€' + (Math.round(n * 100) / 100).toFixed(2);
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const serverNow = () => Date.now() + S.offset;
const parseMoney = s => { const n = parseFloat(String(s || '').replace(/[^\d.,-]/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const dayKey = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
function ago(sec) {
  if (sec == null) return 'never';
  if (sec < 60) return sec + 's ago';
  if (sec < 3600) return Math.round(sec / 60) + ' min ago';
  return Math.round(sec / 3600) + ' h ago';
}
function clock(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function haptic() { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }

// ── API ────────────────────────────────────────────────────────────────────
class ApiError extends Error {}
async function call(method, action, body) {
  if (DEMO) return Demo.handle(method, action, body);
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      let res;
      if (method === 'GET') {
        const qs = new URLSearchParams(Object.assign({ action, key: cfg.key, t: Date.now() }, body || {}));
        res = await fetch(cfg.url + '?' + qs, { cache: 'no-store' });
      } else {
        res = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                     body: JSON.stringify(Object.assign({ action, key: cfg.key }, body || {})) });
      }
      const text = (await res.text()).trim();
      if (text.startsWith('<')) throw new ApiError('Google returned an error page');
      const data = JSON.parse(text);
      if (data.error === 'unauthorized') throw Object.assign(new ApiError('The access key was rejected'), { fatal: true });
      if (data.ok === false && /^(busy|server)/.test(data.error || '')) throw new ApiError(data.error);
      if (data.ok === false) throw Object.assign(new ApiError(data.error || 'Request failed'), { fatal: true });
      return data;
    } catch (e) {
      lastErr = e;
      if (e.fatal) break;
      await new Promise(r => setTimeout(r, 900 * (attempt + 1)));
    }
  }
  throw lastErr instanceof ApiError ? lastErr : new ApiError("Can't reach the sheet");
}
const get = (a, p) => call('GET', a, p);
const post = (a, b) => call('POST', a, b);

// ── Data ───────────────────────────────────────────────────────────────────
async function refresh(force) {
  if (S.loading || (!cfg.key && !DEMO)) return;
  S.loading = true; render();
  try {
    const [status, pending] = await Promise.all([get('status'), get('pending')]);
    S.status = status; S.pending = pending; S.offset = (pending.now || Date.now()) - Date.now();
    S.lastOk = Date.now(); S.error = '';
    if (force || S.tab !== 'queue' || Date.now() - S.recentAt > 60000) await refreshRecent();
    tellWorker();
  } catch (e) {
    S.error = e.message || "Can't reach the sheet";
  }
  S.loading = false; render();
}
async function refreshRecent() {
  try { const r = await get('recent', { limit: 300 }); S.recent = r.orders || []; S.recentAt = Date.now(); } catch (e) {}
}

function products() {
  const m = {};
  ((S.pending && S.pending.products) || []).forEach(p => m[p.code] = p);
  return m;
}
function productLabel(code) {
  const m = products(); code = String(code || '').trim();
  if (m[code]) return m[code].name;
  if (code.includes('+')) return code.split('+').map(c => (m[c.trim()] || {}).name || c.trim()).join(' + ');
  return code || 'No product';
}
function items() {
  if (!S.pending) return [];
  const verdicts = {};
  (((S.status || {}).state || {}).verdicts || []).forEach(v => verdicts[v.row] = v);
  const now = serverNow();
  return (S.pending.rows || []).map(r => {
    const v = verdicts[r.row] || { state: 'unknown', reason: 'The runner hasn’t looked at this row yet.' };
    let state = v.state, reason = humanReason(v.state, v.reason);
    const until = r.lastEdit ? r.lastEdit + QUIET_MS : 0;
    if (until > now && !['manual', 'blocked'].includes(state)) { state = 'waiting'; reason = 'Waiting until edits stop'; }
    if (state === 'waiting' && until <= now) reason = 'Placing on the next check';
    return Object.assign({}, r, { state, reason, until, qty: v.qty || 1, productName: v.productName || productLabel(r.product),
                                  city: v.city || r.city, name: (r.first + ' ' + r.last).trim() || 'No name',
                                  approved: S.approved[r.row] && Date.now() - S.approved[r.row] < 180000 });
  });
}
function todayStats() {
  const today = dayKey(new Date()); let n = 0, sum = 0;
  S.recent.forEach(o => { const d = new Date(o.placedAt); if (!isNaN(d) && dayKey(d) === today) { n++; sum += parseMoney(o.total); } });
  return { n, sum };
}

function humanReason(state, reason) {
  const r = String(reason || '');
  if (state === 'manual') return 'Two products, not a GjirafaMall bundle. Place it on the site, then add the Order ID.';
  if (/^Older row/.test(r)) return 'Entered before automatic ordering started. Approve to place it.';
  if (/^Has note:/.test(r)) return 'Has a note the runner can’t act on. Read it, then approve.';
  if (/^Clean/.test(r)) return 'Everything checks out. Waiting for automatic ordering or your approval.';
  if (/^Shadow/.test(r)) return 'Test mode is on, so nothing is sent to GjirafaMall.';
  if (/^Pending for/.test(r)) return 'This row has waited for days. Approve to place it anyway.';
  if (/^Unverified send/.test(r)) return 'It was sent, but no Order ID came back. Check the back office first.';
  if (/^Possible duplicate of/.test(r)) return r.replace('Possible duplicate of', 'Same customer and product as').replace(/\)$/, ')') + '. Approve only if they ordered again.';
  if (/^No price on product page/.test(r)) return 'The product page shows €0.00, so it can’t be ordered right now.';
  return r;
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  if (!cfg.key && !DEMO) return renderSetup();
  const list = items();
  const needs = list.filter(i => STATES[i.state] && STATES[i.state].group === 'needs');
  const soon = list.filter(i => !STATES[i.state] || STATES[i.state].group === 'soon');
  const st = S.status, runner = st && st.runner;
  const online = runner && runner.online;
  document.title = needs.length ? `(${needs.length}) Argati` : 'Argati';
  try { if (navigator.setAppBadge) needs.length ? navigator.setAppBadge(needs.length) : navigator.clearAppBadge(); } catch (e) {}

  let body = '';
  if (S.tab === 'queue') body = viewQueue(needs, soon);
  if (S.tab === 'placed') body = viewPlaced();
  if (S.tab === 'insights') body = viewInsights();
  if (S.tab === 'settings') body = viewSettings();

  const runnerTxt = !st ? 'Connecting' : online ? (st.state && st.state.mode === 'shadow' ? 'Test mode' : 'Running')
                  : runner && runner.seenAgoSec != null ? 'Offline' : 'No runner';
  $('#tabs').hidden = false;
  $('#content').innerHTML = `
    <div class="wrap">
      <header class="top">
        <div class="brand">Argati<small>Parts Center orders</small></div>
        <button class="runner" data-act="tab" data-tab="settings" aria-label="Runner status: ${esc(runnerTxt)}">
          <span class="dot ${online ? 'on' : st ? 'off' : ''}"></span>${esc(runnerTxt)}</button>
        <button class="icon-btn" data-act="refresh" aria-label="Refresh"><i class="ti ti-refresh ${S.loading ? 'spin' : ''}"></i></button>
      </header>
      ${S.error ? `<div class="banner bad" role="alert"><i class="ti ti-cloud-off"></i><div><b>${esc(S.error)}.</b>
        ${S.lastOk ? 'Showing data from ' + ago(Math.round((Date.now() - S.lastOk) / 1000)) + '.' : ''}</div>
        <button data-act="refresh">Try again</button></div>` : ''}
      ${body}
    </div>`;
  $('#tabs').innerHTML = `<nav aria-label="Sections">
      ${tabBtn('queue', 'ti-list-check', 'Queue', needs.length)}
      ${tabBtn('placed', 'ti-receipt', 'Placed')}
      ${tabBtn('insights', 'ti-chart-bar', 'Insights')}

}
function tabBtn(id, icon, label, badge) {
  return `<button class="tab" data-act="tab" data-tab="${id}" ${S.tab === id ? 'aria-current="page"' : ''}>
    <i class="ti ${icon}"></i>${label}${badge ? `<span class="badge">${badge}</span>` : ''}</button>`;
}

function headline(needs, soon) {
  const st = S.status;
  if (!st) return { text: 'Connecting to the sheet…', cls: '' };
  const r = st.runner || {};
  if (!r.online) return { text: r.seenAgoSec != null ? 'The runner is offline. Orders aren’t being placed.' : 'No runner has connected yet.', cls: 'bad' };
  if (!st.autoMode) return { text: 'Automatic ordering is paused.', cls: 'attn' };
  if (needs.length) return { text: plural(needs.length, 'order needs you.', 'orders need you.'), cls: 'attn' };
  const waiting = soon.filter(i => i.state === 'waiting').length;
  if (waiting) return { text: `Placing ${plural(waiting, 'order', 'orders')} shortly.`, cls: '' };
  return { text: 'All clear.', cls: '' };
}

function viewQueue(needs, soon) {
  const h = headline(needs, soon), t = todayStats(), st = S.status;
  const waiting = soon.filter(i => i.state === 'waiting').sort((a, b) => a.until - b.until);
  let sub = '';
  if (st && st.runner && !st.runner.online && st.runner.seenAgoSec != null) sub = `Last seen ${ago(st.runner.seenAgoSec)}. Check that the office Mac is awake and online.`;
  else if (st && !st.autoMode) sub = 'Clean orders wait for you. Turn it back on in Settings.';
  else sub = `<b class="num">${t.n}</b> placed today${t.sum ? `, <b class="num">${money(t.sum)}</b>` : ''}.`;
  return `
    <section class="hero" aria-live="polite">

        <button class="tick" data-act="open" data-row="${i.row}" aria-label="${esc(i.name)}, places in a moment">
          <span class="ring" data-until="${i.until}"><span class="num">--</span></span>

    </section>

    ${soon.length ? section('Coming up', soon) : ''}
    ${!needs.length && !soon.length && S.pending ? '' : ''}`;
}
function section(title, list, empty) {
  return `<section class="section"><h2>${title}<span class="count num">${list.length || ''}</span></h2>
    <div class="panel">${list.length ? list.map(rowHtml).join('') : empty || ''}</div></section>`;
}
function rowHtml(i) {
  const s = STATES[i.state] || STATES.unknown;
  let action = '';
  if (i.approved && ['review', 'unverified', 'ready'].includes(i.state)) action = `<span class="chip">Approved</span>`;
  else if (i.state === 'review') action = `<span class="btn primary" data-act="approve" data-row="${i.row}">Approve</span>`;

    </div>${action}</button>`;
}

function viewPlaced() {
  const q = S.query.trim().toLowerCase();
  const list = S.recent.filter(o => !q || [o.name, o.orderId, o.city, o.product, o.productName].join(' ').toLowerCase().includes(q));
  const groups = [];
  list.forEach(o => {
    const d = new Date(o.placedAt), k = isNaN(d) ? 'unknown' : dayKey(d);
    let g = groups[groups.length - 1];
    if (!g || g.k !== k) groups.push(g = { k, d, items: [], sum: 0 });
    g.items.push(o); g.sum += parseMoney(o.total);
  });
  const label = g => {
    if (g.k === 'unknown') return 'Earlier';
    const today = new Date(), y = new Date(Date.now() - 86400000);
    if (g.k === dayKey(today)) return 'Today';
    if (g.k === dayKey(y)) return 'Yesterday';
    return g.d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  };
  return `
    <label class="search"><i class="ti ti-search"></i>
      <input type="search" id="q" placeholder="Search name, Order ID or city" value="${esc(S.query)}" autocomplete="off" enterkeyhint="search"></label>
    ${!S.recentAt ? `<div class="empty">Loading placed orders…</div>` :
      !groups.length ? `<div class="empty"><b>No matches.</b>Try a surname or an Order ID like 1277076.</div>` :
      groups.map(g => `<div class="day"><span>${label(g)}</span><span class="num">${plural(g.items.length, 'order', 'orders')}${g.sum ? ', ' + money(g.sum) : ''}</span></div>
        <div class="panel">${g.items.map(o => {
          const d = new Date(o.placedAt);
          return `<div class="prow"><div class="main"><div class="name">${esc(o.name)}</div>
            <div class="line2">${isNaN(d) ? '' : d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + ', '}${esc(o.productName)}, ${esc(o.city)}</div></div>
            <div class="right"><button class="oid num" data-act="copy" data-text="${esc(o.orderId)}" aria-label="Copy ${esc(o.orderId)}">${esc(o.orderId)}</button>
            <div class="total num">${o.total ? money(parseMoney(o.total)) : ''}</div></div></div>`;
        }).join('')}</div>`).join('')}`;
}

function viewInsights() {
  const orders = S.recent.map(o => Object.assign({}, o, { d: new Date(o.placedAt), v: parseMoney(o.total) })).filter(o => !isNaN(o.d));
  if (!orders.length) return `<div class="empty" style="margin-top:20px"><b>No data yet.</b>Insights appear once orders are placed.</div>`;
  const now = new Date(), start = d => { const x = new Date(now); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - d); return x; };
  const sumIn = from => orders.filter(o => o.d >= from).reduce((a, o) => ({ n: a.n + 1, v: a.v + o.v }), { n: 0, v: 0 });
  const t = sumIn(start(0)), w = sumIn(start(6)), m = sumIn(start(29));
  const days = [...Array(14)].map((_, i) => { const d = start(13 - i), k = dayKey(d);
    const os = orders.filter(o => dayKey(o.d) === k); return { d, n: os.length, v: os.reduce((a, o) => a + o.v, 0) }; });
  const max = Math.max(1, ...days.map(d => d.n)), W = 600, H = 150, bw = W / 14;
  const svg = `<svg viewBox="0 0 ${W} ${H + 22}" role="img" aria-label="Orders per day, last 14 days">${days.map((d, i) => {
      const h = Math.max(d.n ? 4 : 1, (d.n / max) * H), x = i * bw + 5, isToday = i === 13;
      return `<rect x="${x}" y="${H - h}" width="${bw - 10}" height="${h}" rx="4" fill="${isToday ? 'var(--flame)' : 'var(--steel)'}" opacity="${isToday ? 1 : .55}"><title>${d.d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}: ${d.n} orders</title></rect>
        ${d.n ? `<text x="${x + (bw - 10) / 2}" y="${H - h - 5}" text-anchor="middle" class="axis num">${d.n}</text>` : ''}
        ${i % 2 === 1 || isToday ? `<text x="${x + (bw - 10) / 2}" y="${H + 16}" text-anchor="middle" class="axis">${isToday ? 'Today' : d.d.getDate()}</text>` : ''}`;
    }).join('')}</svg>`;
  const top = key => { const c = {}; orders.filter(o => o.d >= start(29)).forEach(o => { const k = o[key] || '—'; c[k] = (c[k] || 0) + 1; });
    return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 6); };
  const bars = rows => { const mx = Math.max(1, ...rows.map(r => r[1]));
    return `<div class="panel bars">${rows.map(([k, n]) => `<div class="item"><span class="label">${esc(k)}</span><span class="val num">${n}</span>
      <span class="bar"><i style="width:${(n / mx) * 100}%"></i></span></div>`).join('')}</div>`; };
  return `
    <div class="figures">
      <div class="fig"><div class="k">Today</div><div class="v num">${t.n}</div><div class="m num">${money(t.v)}</div></div>
      <div class="fig"><div class="k">7 days</div><div class="v num">${w.n}</div><div class="m num">${money(w.v)}</div></div>
      <div class="fig"><div class="k">30 days</div><div class="v num">${m.n}</div><div class="m num">${money(m.v)}</div></div>
    </div>
    <section class="section"><h2>Orders per day</h2><div class="panel chart">${svg}</div></section>
    <section class="section"><h2>Top products, 30 days</h2>${bars(top('productName'))}</section>
    <section class="section"><h2>Top cities, 30 days</h2>${bars(top('city'))}</section>
    <p class="note">Based on the latest ${plural(orders.length, 'order', 'orders')} in the sheet.</p>`;
}

function tickCountdowns() {
  const now = serverNow();
  document.querySelectorAll('.ring[data-until]').forEach(el => {
    const left = Number(el.dataset.until) - now;
    el.style.setProperty('--p', Math.max(0, Math.min(100, 100 - (left / QUIET_MS) * 100)).toFixed(1));
    el.querySelector('span').textContent = left > 0 ? clock(left) : 'now';
  });
}

// ── Detail sheet ───────────────────────────────────────────────────────────
function openSheet(row) { S.open = row; renderSheet(); $('#scrim').classList.add('open'); $('#sheet').classList.add('open');
  setTimeout(() => { const c = $('#sheet .close'); c && c.focus(); }, 60); }
function closeSheet() { S.open = null; $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); }
function renderSheet() {
  const i = items().find(x => x.row === S.open);
  if (!i) { closeSheet(); return; }
  const s = STATES[i.state] || STATES.unknown, st = S.status || {};
  const sheetRow = st.sheetUrl ? st.sheetUrl + '&range=A' + i.row : '';
  const prods = products();
  const parts = String(i.product || '').split('+').map(c => c.trim()).filter(Boolean);
  const whole = prods[String(i.product).trim()];
  const links = whole ? [whole] : parts.map(c => prods[c]).filter(Boolean);
  let actions = '';
  if (i.state === 'review' || i.state === 'ready') {
    const dup = /duplicate/i.test(i.reason || '');
    actions = `${dup ? `<p class="warnline">Looks like a duplicate. Approve only if this customer really ordered again.</p>` : ''}
      <button class="btn primary block" data-act="approve" data-row="${i.row}" ${i.approved ? 'disabled' : ''}>${i.approved ? 'Approved, placing soon' : 'Approve and place'}</button>`;
  } else if (i.state === 'unverified') {
    actions = `<p class="warnline">The order was sent but no answer came back. Check the back office first. If it is there, add its Order ID instead.</p>
      <button class="btn primary block" data-act="approve" data-row="${i.row}" data-confirm="1" ${i.approved ? 'disabled' : ''}>Not in the back office, place it</button>
      ${idForm(i)}`;
  } else if (i.state === 'manual') {
    actions = `${links.map(p => `<a class="btn quiet block" href="${esc(p.url)}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i>Open ${esc(p.code)} on GjirafaMall</a>`).join('')}
      ${idForm(i)}`;
  } else if (i.state === 'blocked') {
    actions = sheetRow ? `<a class="btn primary block" href="${esc(sheetRow)}" target="_blank" rel="noopener"><i class="ti ti-table"></i>Fix it in the sheet</a>` : '';
  }
  const fact = (icon, k, v, href) => v ? `<${href ? `a href="${esc(href)}"` : 'div'} class="fact"><i class="ti ${icon}"></i><div><div class="k">${k}</div><div class="v">${esc(v)}</div></div></${href ? 'a' : 'div'}>` : '';
  $('#sheet').innerHTML = `
    <div class="grab"></div>
    <button class="icon-btn close" data-act="close" aria-label="Close"><i class="ti ti-x"></i></button>
    <h3 id="sheet-title">${esc(i.name)}</h3>
    <p class="prod">${esc(i.productName)}${i.qty > 1 ? ' ×' + i.qty : ''}, ${esc(i.city || 'no city')}</p>
    <div class="status-box t-${s.tone}"><div class="state">${esc(s.label)}</div>
      <p>${esc(i.reason || '')}</p></div>
    <div class="facts">
      ${fact('ti-phone', 'Phone', i.phone, i.phone ? 'tel:' + i.phone.replace(/[^\d+]/g, '') : '')}
      ${fact('ti-map-pin', 'Address', i.address)}
      ${fact('ti-message', 'Comment', i.comment)}
      ${fact('ti-package', 'Product code', i.product)}
      ${sheetRow ? fact('ti-table', 'Sheet', 'Row ' + i.row, sheetRow) : fact('ti-table', 'Sheet', 'Row ' + i.row)}
    </div>
    <div class="actions">${actions}</div>`;
}
function idForm(i) {
  return `<label class="field" style="padding:4px 0 0;border:0"><span>Order ID from GjirafaMall</span>
    <input id="oid" inputmode="numeric" placeholder="e.g. 1277076" autocomplete="off"></label>
    <button class="btn quiet block" data-act="saveid" data-row="${i.row}">Save Order ID</button>`;
}

// ── Actions ────────────────────────────────────────────────────────────────
async function approve(row, strong) {
  const i = items().find(x => x.row === row); if (!i) return;
  if (strong && !confirm(`Place ${i.name}'s order again?\n\nOnly do this if it is NOT in the GjirafaMall back office.`)) return;
  haptic(); S.approved[row] = Date.now(); render();
  try { await post('approve', { row: i.row, product: i.product, phone: i.phone }); toast('Approved. It will be placed within a minute.'); }
  catch (e) { delete S.approved[row]; render(); toast('Approval didn’t go through: ' + e.message); }
}
async function saveOrderId(row) {
  const i = items().find(x => x.row === row); const v = (($('#oid') || {}).value || '').replace(/\D/g, '');
  if (!i) return;
  if (v.length < 5) { toast('Enter the Order ID number, e.g. 1277076'); return; }
  haptic();
  try {
    await post('setOrderId', { row: i.row, product: i.product, phone: i.phone, first: i.first, last: i.last, orderId: v });
    toast(`Saved #${v} to row ${i.row}.`); closeSheet(); refresh(true);
  } catch (e) { toast('Couldn’t save: ' + e.message); }
}
async function setAuto(on, input) {
  if (on && !confirm('Turn on automatic ordering?\n\nClean orders will be placed 2 minutes after the last edit.')) { input.checked = false; return; }
  try { await post('setAuto', { on }); S.status.autoMode = on; toast(on ? 'Automatic ordering is on.' : 'Automatic ordering is paused.'); render(); }
  catch (e) { input.checked = !on; toast('Couldn’t change it: ' + e.message); }
}
async function saveConnection() {
  const key = ($('#key').value || '').trim(), url = ($('#url').value || '').trim() || DEFAULT_URL;
  const prev = cfg; cfg = { key, url };
  try { await get('status'); store.set(cfg); toast('Connected.'); refresh(true); }
  catch (e) { cfg = prev; toast(e.message); }
}

// ── Notifications + service worker ─────────────────────────────────────────
function pushState() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    return { can: false, text: isIOS && !standalone ? 'On iPhone, add Argati to the Home Screen first (Share, Add to Home Screen).' : 'This browser can’t receive notifications.' };
  }
  const p = Notification.permission;
  if (p === 'denied') return { can: false, text: 'Blocked. Allow notifications for Argati in the device settings.' };
  return { can: true, on: p === 'granted', text: p === 'granted' ? 'On. Orders, problems and runner alerts arrive here.' : 'Off. Turn on to get order and runner alerts.' };
}
function b64ToBytes(b64) { const pad = '='.repeat((4 - b64.length % 4) % 4), raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); }
async function enablePush() {
  if (DEMO) { toast('Notifications are off in the demo.'); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications weren’t allowed.'); render(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    await post('subscribe', { subscription: sub.toJSON() });
    toast('Notifications are on for this device.'); render();
  } catch (e) { toast('Couldn’t turn on notifications: ' + e.message); }
}
function tellWorker() {
  if (DEMO || !navigator.serviceWorker || !navigator.serviceWorker.controller) return;
  navigator.serviceWorker.controller.postMessage({ type: 'config', url: cfg.url, key: cfg.key });
}

// ── Setup screen ───────────────────────────────────────────────────────────
function renderSetup() {
  $('#tabs').hidden = true;
  $('#content').innerHTML = `
    <main class="setup">
      <h1>Connect Argati</h1>
      <p>Paste the access key from the Apps Script setup log. You only do this once per device.</p>
      <div class="panel">
        <label class="field"><span>Access key</span><input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="32 letters and numbers"></label>
        <div class="field"><button class="btn primary block" data-act="connect">Connect</button></div>
      </div>
      <div class="err" id="err" role="alert"></div>
      <p class="alt">Just looking? <a href="?demo">Open the demo with sample data</a></p>
    </main>`;
  setTimeout(() => { const k = $('#key'); k && k.focus(); }, 50);
}
async function connect() {
  const key = ($('#key').value || '').trim(); const err = $('#err');
  if (!key) { err.textContent = 'Paste the access key first.'; return; }
  err.textContent = 'Checking…'; cfg = { key, url: cfg.url || DEFAULT_URL };
  try { await get('status'); store.set(cfg); S.error = ''; render(); refresh(true); }
  catch (e) { cfg.key = ''; err.textContent = e.message === 'The access key was rejected' ? 'That key was rejected. Copy it again from the setup log.' : e.message + '. Check your connection and try again.'; }
}

// ── Events ─────────────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, row = Number(el.dataset.row);
  if (act === 'tab') { S.tab = el.dataset.tab; render(); $('#view').scrollTop = 0; if (S.tab !== 'queue' && Date.now() - S.recentAt > 30000) refreshRecent().then(render); }
  else if (act === 'refresh') refresh(true);
  else if (act === 'open') { e.preventDefault(); openSheet(row); }
  else if (act === 'approve') { e.stopPropagation(); approve(row, el.dataset.confirm === '1'); }
  else if (act === 'saveid') saveOrderId(row);
  else if (act === 'close') closeSheet();
  else if (act === 'copy') { navigator.clipboard && navigator.clipboard.writeText(el.dataset.text).then(() => toast('Copied ' + el.dataset.text)); }
  else if (act === 'push') enablePush();
  else if (act === 'testpush') post('alert', { title: '🔔 Argati test', body: 'Notifications work on this device.' }).then(() => toast('Test sent.'), err => toast(err.message));
  else if (act === 'saveconn') saveConnection();
  else if (act === 'connect') connect();
});
document.addEventListener('change', e => { if (e.target.matches('[data-act="auto"]')) setAuto(e.target.checked, e.target); });
document.addEventListener('input', e => { if (e.target.id === 'q') { S.query = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open != null) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'key' && !cfg.key) connect(); });
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, POLL_MS);
setInterval(tickCountdowns, 1000);
if ('serviceWorker' in navigator && !DEMO) {
  navigator.serviceWorker.register('sw.js').then(() => tellWorker()).catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'refresh') refresh(true); });
}

// ── Demo data (?demo) ──────────────────────────────────────────────────────
const Demo = {
  auto: true,
  products: [['104','Pastrues Filtrave DPF 104'],['106','DPF Additiv 106'],['107','Pastrues DPF 107'],['201','Super Diesel Additiv 201'],
    ['204','Pastrues Injektimit Dizel 204'],['207','Additiv Vaj Motorik 207'],['210','Pastrues Injektimit Benzine 210'],
    ['204+107+106','Set Diesel 2+1 Gratis'],['210+209+206','Set Benzine 2+1 Gratis']].map(([code, name]) => ({ code, name, url: 'https://gjirafamall.com/', active: true })),
  build() {
    if (this.data) return this.data;
    const now = Date.now(), r = (row, first, last, product, city, extra) => Object.assign({ row, first, last, product, city,
      phone: '044' + String(100000 + row * 7919).slice(-6), address: 'Rr. Agim Ramadani ' + (row % 40 + 1), comment: '', lastEdit: now - 600000 }, extra || {});
    const rows = [
      r(701, 'Blerim', 'Gashi', '204', 'Prishtinë', { lastEdit: now - 38000 }),
      r(702, 'Arta', 'Hoxha', '204+107+106', 'Pejë', { lastEdit: now - 85000 }),

      r(704, 'Driton', 'Berisha', '204+207', 'Gjakovë'),
      r(705, 'Valon', 'Morina', '210', 'Prizren', { phone: '04512' }),
      r(706, 'Shpresa', 'Kelmendi', '204', 'Mitrovicë', { lastEdit: 0 }),
    ];
    const verdicts = [
      { row: 703, state: 'review', reason: 'Has note: Thirrni pas orës 17', qty: 1, city: 'Ferizaj', productName: 'Additiv Vaj Motorik 207' },
      { row: 704, state: 'manual', reason: 'Place manually on GjirafaMall (combination, not a bundle)', qty: 1, city: 'Gjakovë' },
      { row: 705, state: 'blocked', reason: "Invalid phone '04512'", qty: 1, city: 'Prizren' },
      { row: 706, state: 'review', reason: 'Older row (no edit stamp) — approve or re-edit to place', qty: 1, city: 'Mitrovicë' },
    ];
    const names = [['Genc','Pacarizi','Malishevë'],['Shaban','Abdyli','Prishtinë'],['Besnik','Sadiku','Shtime'],['Nevzat','Goga','Pejë'],
      ['Artan','Rizanaj','Prizren'],['Shef','Xeni','Ferizaj'],['Nysret','Sertolli','Malishevë'],['Bardh','Bardhi','Kamenicë'],['Enis','Berisha','Prishtinë'],['Arsim','Kurteshi','Ferizaj']];
    const prods = [['204+107+106','Set Diesel 2+1 Gratis',21.9],['207','Additiv Vaj Motorik 207',11.9],['204','Pastrues Injektimit Dizel 204',11.9],
      ['210','Pastrues Injektimit Benzine 210',12.95],['210+209+206','Set Benzine 2+1 Gratis',21.9]];
    const recent = [];
    let id = 1277076;
    for (let d = 0; d < 20; d++) {
      const count = d === 0 ? 9 : 4 + ((d * 7) % 9);
      for (let k = 0; k < count; k++) {
        const n = names[(d * 3 + k) % names.length], p = prods[(d + k * 2) % prods.length];
        const t = new Date(now - d * 86400000); t.setHours(9 + (k % 9), (k * 17) % 60);
        if (t > now) t.setTime(now - k * 600000);
        recent.push({ row: 690 - recent.length, orderId: '#' + (id--), product: p[0], productName: p[1], name: n[0] + ' ' + n[1], city: n[2], total: String(p[2]), placedAt: t.toISOString() });
      }
    }
    recent.sort((a, b) => b.placedAt.localeCompare(a.placedAt));
    return this.data = { rows, verdicts, recent };
  },
  handle(method, action, body) {
    const d = this.build(), now = Date.now();
    const wait = ms => new Promise(r => setTimeout(r, ms));
    if (action === 'status') return wait(150).then(() => ({ ok: true, now, version: '2.1.0', autoMode: this.auto, sheetUrl: '',
      runner: { id: 'Office-Mac.local', online: true, seenAgoSec: 14 },
      state: { mode: 'live', stats: { placedToday: 9, uptimeMin: 312 }, verdicts: d.verdicts } }));
    if (action === 'pending') return wait(150).then(() => ({ ok: true, now, autoMode: this.auto, approvals: [], products: this.products, rows: d.rows }));
    if (action === 'recent') return wait(100).then(() => ({ ok: true, orders: d.recent }));
    if (action === 'setAuto') { this.auto = !!body.on; return wait(250).then(() => ({ ok: true })); }
    if (action === 'approve' || action === 'alert' || action === 'subscribe') return wait(300).then(() => ({ ok: true }));
    if (action === 'setOrderId') { d.rows = d.rows.filter(r => r.row !== body.row); return wait(300).then(() => ({ ok: true })); }
    return Promise.resolve({ ok: true });
  }
};

render();
refresh(true);
