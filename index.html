<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Argati">
<title>Argati</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --primary:       #ff4500;
    --primary-light: rgba(255,69,0,0.09);
    --bg:            #f0f2f5;
    --card:          #ffffff;
    --text:          #0f172a;
    --muted:         #94a3b8;
    --border:        #e8ecf0;
    --shadow:        rgba(0,0,0,0.07);
    --green:         #10b981;
    --amber:         #f59e0b;
    --red:           #ef4444;
}
body.dark {
    --primary:       #ff5722;
    --primary-light: rgba(255,87,34,0.12);
    --bg:            #0f1117;
    --card:          #1a1d27;
    --text:          #e2e8f0;
    --muted:         #64748b;
    --border:        #2a2d3a;
    --shadow:        rgba(0,0,0,0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
    font-family: 'DM Sans', -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
    padding-bottom: calc(100px + env(safe-area-inset-bottom));
    transition: background 0.25s, color 0.25s;
}

/* ── HEADER ─────────────────────────────────────────────────────────────────── */
.header {
    position: sticky; top: 0; z-index: 50;
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: calc(env(safe-area-inset-top) + 14px) 18px 14px;
    display: flex; align-items: center; gap: 12px;
}
.header-icon {
    width: 40px; height: 40px; background: var(--primary);
    border-radius: 12px; display: flex; align-items: center;
    justify-content: center; font-size: 22px; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(255,69,0,0.3);
}
.header-text { flex: 1; }
.header-title { font-size: 17px; font-weight: 800; color: var(--text); }
.header-sub   { font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 1px; }
.header-btns  { display: flex; gap: 8px; }
.icon-btn {
    width: 36px; height: 36px; border: 1.5px solid var(--border);
    border-radius: 10px; background: var(--card); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer; padding: 0; line-height: 1;
    transition: all 0.15s;
}
.icon-btn:active { border-color: var(--primary); background: var(--primary-light); transform: scale(0.92); }
#reload-btn.spinning { animation: spin 0.5s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── MAIN ───────────────────────────────────────────────────────────────────── */
.main { padding: 14px 16px; }

/* ── NEW ORDER BANNER ───────────────────────────────────────────────────────── */
#new-order-banner {
    display: none; background: var(--green); color: white;
    font-size: 13px; font-weight: 700; text-align: center;
    padding: 11px 18px; margin-bottom: 14px; border-radius: 14px;
    animation: slideDown 0.3s ease;
}
@keyframes slideDown { from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)} }

/* ── STATS BAR ──────────────────────────────────────────────────────────────── */
.stats-bar {
    display: flex; align-items: center;
    background: var(--card); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 10px var(--shadow);
}
.stat-item  { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.stat-num   { font-size: 26px; font-weight: 800; color: var(--green); line-height: 1; }
.stat-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.stat-divider { width: 1px; height: 36px; background: var(--border); margin: 0 10px; }

/* ── SECTION LABEL ──────────────────────────────────────────────────────────── */
.section-label {
    font-size: 10px; font-weight: 800; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 10px 2px;
}

/* ── ORDER CARD ─────────────────────────────────────────────────────────────── */
.order-card {
    background: var(--card); border-radius: 18px;
    padding: 16px; margin-bottom: 10px;
    border: 2px solid var(--border);
    box-shadow: 0 2px 12px var(--shadow);
    cursor: pointer;
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
}
.order-card:active { transform: scale(0.985); }
.order-card.review { border-color: rgba(245,158,11,0.35); }

/* Selected state */
.order-card.selected {
    border-color: var(--primary) !important;
    background: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(255,69,0,0.15), 0 2px 12px var(--shadow);
}
.order-card.review.selected { box-shadow: 0 0 0 3px rgba(245,158,11,0.2), 0 2px 12px var(--shadow); }

/* Checkbox tick in top-right corner */
.card-check {
    position: absolute; top: 14px; right: 14px;
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--card);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800;
    transition: all 0.15s;
    flex-shrink: 0;
}
.order-card.selected .card-check {
    background: var(--primary); border-color: var(--primary); color: white;
}

.card-top  { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-right: 36px; }
.card-badge {
    background: var(--primary-light); color: var(--primary);
    font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 8px; flex-shrink: 0;
}
.order-card.review .card-badge { background: rgba(245,158,11,0.12); color: var(--amber); }
.card-label {
    font-size: 11px; font-weight: 700; color: var(--muted);
}
.order-card.selected .card-label { color: var(--primary); }

.card-name { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 10px; }

.card-detail {
    display: flex; align-items: center; gap: 9px;
    font-size: 13px; color: var(--muted); margin-bottom: 7px; font-weight: 500;
}
.card-detail .icon { font-size: 14px; flex-shrink: 0; }
.card-detail .val  { color: var(--text); font-weight: 600; }

.card-alert {
    display: flex; align-items: flex-start; gap: 8px;
    margin-top: 10px; padding: 9px 12px; border-radius: 11px;
    font-size: 12px; line-height: 1.5; font-weight: 600;
}
.alert-multi   { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; }
.alert-comment { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
body.dark .alert-multi   { background: #2d1a0a; border-color: #7c3509; color: #fb923c; }
body.dark .alert-comment { background: #0d1f3c; border-color: #1e3a8a; color: #93c5fd; }

/* ── FLOATING ACTION BAR ────────────────────────────────────────────────────── */
#fab {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 16px; right: 16px;
    z-index: 100;
    display: none;
    animation: fabUp 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes fabUp { from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)} }

.fab-inner {
    background: var(--primary);
    border-radius: 18px;
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 8px 28px rgba(255,69,0,0.4);
}
.fab-left  { display: flex; flex-direction: column; gap: 1px; }
.fab-count { font-size: 18px; font-weight: 800; color: white; line-height: 1; }
.fab-sub   { font-size: 11px; color: rgba(255,255,255,0.75); font-weight: 600; }
.fab-btn {
    background: white; color: var(--primary);
    border: none; border-radius: 12px;
    padding: 11px 20px; font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 14px; font-weight: 800; cursor: pointer; letter-spacing: 0.03em;
    transition: transform 0.12s;
}
.fab-btn:active { transform: scale(0.95); }
.fab-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* deselect all pill */
.fab-clear {
    background: rgba(255,255,255,0.18); color: white;
    border: none; border-radius: 8px;
    padding: 6px 12px; font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 11px; font-weight: 700; cursor: pointer;
    margin-top: 6px; display: block; width: 100%; text-align: center;
    transition: background 0.15s;
}
.fab-clear:active { background: rgba(255,255,255,0.3); }

/* ── HISTORY ────────────────────────────────────────────────────────────────── */
.panel-toggle {
    width: 100%; padding: 13px 16px; border: 1.5px solid var(--border);
    border-radius: 14px; background: var(--card); color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 13px; font-weight: 700; cursor: pointer;
    text-align: center; margin-bottom: 10px; transition: all 0.15s;
}
.panel-toggle:active { border-color: var(--primary); background: var(--primary-light); }
.panel-body { display: none; background: var(--card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; }
.history-item { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 12px; }
.history-item:last-child { border-bottom: none; }
.history-top    { display:flex; justify-content:space-between; margin-bottom:4px; }
.history-name   { font-weight:700; color:var(--text); font-size:13px; }
.history-time   { color:var(--muted); font-size:11px; }
.history-bottom { display:flex; justify-content:space-between; align-items:center; }
.history-product { color:var(--muted); font-weight:500; }
.history-result  { font-size:12px; font-weight:800; }
.history-result.ok  { color:var(--green); }
.history-result.err { color:var(--red); }
.history-empty  { padding:24px; text-align:center; color:var(--muted); font-size:13px; }

/* ── EMPTY STATE ────────────────────────────────────────────────────────────── */
.empty-state {
    text-align:center; padding:48px 20px;
    background:var(--card); border-radius:20px;
    border:1px solid var(--border); box-shadow:0 2px 10px var(--shadow);
}
.empty-icon  { font-size:52px; margin-bottom:14px; }
.empty-title { font-size:18px; font-weight:800; margin-bottom:2px; }
.empty-sub   { font-size:14px; color:var(--muted); }

/* ── LOADING ────────────────────────────────────────────────────────────────── */
.loading { text-align:center; padding:48px 20px; color:var(--muted); }
.spinner {
    width:32px; height:32px; border:3px solid var(--border);
    border-top-color:var(--primary); border-radius:50%;
    animation:spin 0.7s linear infinite; margin:0 auto 14px;
}

/* ── STATUS ─────────────────────────────────────────────────────────────────── */
#status-bar { text-align:center; font-size:12px; color:var(--muted); font-weight:600; padding:8px 0 4px; }

/* ── NOTIFICATION OVERLAY ───────────────────────────────────────────────────── */
.notif-overlay {
    position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,0.65); backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center; padding:24px;
}
.notif-overlay.show { display:flex; animation:fadeIn 0.2s ease; }
@keyframes fadeIn { from{opacity:0}to{opacity:1} }

.notif-card {
    background:var(--card); border-radius:26px;
    padding:32px 28px; text-align:center;
    width:100%; max-width:320px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
    animation:popUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popUp { from{transform:scale(0.85);opacity:0}to{transform:scale(1);opacity:1} }

.notif-icon  { font-size:56px; margin-bottom:16px; }
.notif-title { font-size:22px; font-weight:800; margin-bottom:8px; }
.notif-sub   { font-size:14px; color:var(--muted); font-weight:500; line-height:1.6; margin-bottom:24px; white-space:pre-line; }
.notif-btn {
    width:100%; padding:14px; border:none; border-radius:14px;
    font-family:'DM Sans',system-ui,sans-serif;
    font-size:15px; font-weight:800; cursor:pointer;
    background:var(--primary); color:white; transition:all 0.15s;
}
.notif-btn:active { transform:scale(0.97); }
.notif-btn.green { background:var(--green); }
.notif-btn.red   { background:var(--red); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="header-icon">🤖</div>
    <div class="header-text">
        <div class="header-title">Argati</div>
        <div class="header-sub">Approval Center</div>
    </div>
    <div class="header-btns">
        <button class="icon-btn" id="theme-btn">🌙</button>
        <button class="icon-btn" id="reload-btn">↻</button>
    </div>
</div>

<div class="main">
    <div id="new-order-banner"></div>

    <!-- STATS -->
    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-num" id="stat-today">—</span>
            <span class="stat-label">Today ✅</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
            <span class="stat-num" id="stat-pending" style="color:var(--primary)">—</span>
            <span class="stat-label">Pending</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
            <span class="stat-num" id="stat-review" style="color:var(--amber)">—</span>
            <span class="stat-label">Review ⚠️</span>
        </div>
    </div>

    <!-- ORDER LIST -->
    <div id="order-list">
        <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>

    <!-- HISTORY -->
    <button class="panel-toggle" id="history-toggle">📋 History</button>
    <div class="panel-body" id="history-panel">
        <div id="history-list"><div class="history-empty">No orders yet.</div></div>
    </div>

    <div id="status-bar"></div>
</div>

<!-- FLOATING ACTION BAR (appears when cards are selected) -->
<div id="fab">
    <div class="fab-inner">
        <div class="fab-left">
            <div class="fab-count" id="fab-count">0 selected</div>
            <div class="fab-sub">Tap Place to send them</div>
        </div>
        <button class="fab-btn" id="fab-approve-btn" onclick="approveSelected()">▶ Place Orders</button>
    </div>
    <button class="fab-clear" onclick="clearSelection()">✕ Clear selection</button>
</div>

<!-- NOTIFICATION OVERLAY -->
<div class="notif-overlay" id="notif-overlay">
    <div class="notif-card">
        <div class="notif-icon"  id="notif-icon">✅</div>
        <div class="notif-title" id="notif-title">Order placed!</div>
        <div class="notif-sub"   id="notif-sub"></div>
        <button class="notif-btn" id="notif-btn" onclick="closeNotif()">OK</button>
    </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwJNKQM60EgtoiL9_j0qI8B9hLrjTH9fruhpakO0aMgrJFosgm0dDMkUFWPCAxQlEL7MA/exec';

let allOrders    = [];  // all pending from sheet
let selectedRows = new Set(); // rowNumbers currently selected
let lastCount    = -1;
let orderHistory = [];
let processingQueue = []; // multi-select approve queue

const PRODUCTS = {
    "105":"Pastrues Frenave 105","106":"DPF Additiv 106","107":"Pastrues DPF 107",
    "201":"Super Diesel Additiv 201","204":"Pastrues Injektimit Dizel 204",
    "206":"Perforcues Oktani 206","207":"Additiv Vaj Motorik 207",
    "209":"Super Benzin Additiv 209","210":"Pastrues Injektimit Benzine 210"
};
function getProduct(raw) {
    if (!raw) return '—';
    const c = raw.toString().trim();
    if (c.includes('+')) return c.split('+').map(x => PRODUCTS[x.trim()]||x.trim()).join(' + ');
    return PRODUCTS[c] || c;
}

// ─── DARK MODE ────────────────────────────────────────────────────────────────
function applyTheme(dark) {
    document.body.classList.toggle('dark', dark);
    document.getElementById('theme-btn').innerText = dark ? '☀️' : '🌙';
    localStorage.setItem('darkMode', dark ? '1' : '');
}
document.getElementById('theme-btn').addEventListener('click', () => applyTheme(!document.body.classList.contains('dark')));
if (localStorage.getItem('darkMode')) applyTheme(true);

// ─── HISTORY TOGGLE ───────────────────────────────────────────────────────────
document.getElementById('history-toggle').addEventListener('click', () => {
    const panel = document.getElementById('history-panel');
    const btn   = document.getElementById('history-toggle');
    const open  = panel.style.display !== 'block';
    panel.style.display = open ? 'block' : 'none';
    btn.innerText = open ? '📋 Close ✕' : '📋 History';
});

// ─── NOTIFICATION ─────────────────────────────────────────────────────────────
function showNotif(icon, title, sub, btnClass) {
    document.getElementById('notif-icon').innerText  = icon;
    document.getElementById('notif-title').innerText = title;
    document.getElementById('notif-sub').innerText   = sub;
    document.getElementById('notif-btn').className   = 'notif-btn ' + (btnClass||'');
    document.getElementById('notif-overlay').classList.add('show');
    if (navigator.vibrate) navigator.vibrate(btnClass === 'red' ? [100,50,100] : [80]);
}
function closeNotif() {
    document.getElementById('notif-overlay').classList.remove('show');
}

// ─── SELECTION ────────────────────────────────────────────────────────────────
function toggleSelect(rowNumber) {
    // Instant visual — no reload needed
    if (selectedRows.has(rowNumber)) {
        selectedRows.delete(rowNumber);
    } else {
        selectedRows.add(rowNumber);
    }
    // Update just this card's visual state
    const card = document.getElementById('card-' + rowNumber);
    if (card) {
        card.classList.toggle('selected', selectedRows.has(rowNumber));
        const check = card.querySelector('.card-check');
        if (check) check.innerText = selectedRows.has(rowNumber) ? '✓' : '';
    }
    updateFAB();
}

function clearSelection() {
    selectedRows.forEach(r => {
        const card = document.getElementById('card-' + r);
        if (card) {
            card.classList.remove('selected');
            const check = card.querySelector('.card-check');
            if (check) check.innerText = '';
        }
    });
    selectedRows.clear();
    updateFAB();
}

function updateFAB() {
    const fab   = document.getElementById('fab');
    const count = selectedRows.size;
    if (count === 0) {
        fab.style.display = 'none';
        return;
    }
    fab.style.display = 'block';
    document.getElementById('fab-count').innerText =
        count === 1 ? '1 order selected' : count + ' order selecteda';
}

// ─── STATS BAR ────────────────────────────────────────────────────────────────
function updateStats(orders, completedToday) {
    const reviewCount = orders.filter(o => {
        const c = (o['Koment shtese (Nese ka)']||'').toString().trim();
        const m = (o.Produkti||'').toString().includes('+');
        return c !== '' || m;
    }).length;
    document.getElementById('stat-today').innerText   = completedToday;
    document.getElementById('stat-pending').innerText = orders.length;
    document.getElementById('stat-review').innerText  = reviewCount;
}

// ─── LOAD ORDERS ──────────────────────────────────────────────────────────────
async function loadOrders(silent = false) {
    const list = document.getElementById('order-list');
    if (!silent) list.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

    try {
        const res    = await fetch(SCRIPT_URL + '?t=' + Date.now());
        const orders = await res.json();

        const todayStr = new Date().toDateString();
        const completedToday = orders.filter(o => {
            const oid = (o.OrderID||'').toString().trim();
            if (!oid || oid.toLowerCase()==='pending') return false;
            const placed = (o.PlacedDate||'').toString().trim();
            try { return placed && new Date(placed).toDateString()===todayStr; } catch(e) { return false; }
        }).length;

        allOrders = orders.filter(o => {
            const oid = (o.OrderID||'').toString().trim();
            return oid==='' || oid.toLowerCase()==='pending';
        });

        // Remove selections for orders that are no longer pending
        selectedRows.forEach(r => {
            if (!allOrders.find(o => o.rowNumber == r)) selectedRows.delete(r);
        });

        // Detect new orders
        if (lastCount >= 0 && allOrders.length > lastCount) {
            const diff = allOrders.length - lastCount;
            const banner = document.getElementById('new-order-banner');
            banner.innerText = '🔔 ' + diff + (diff===1 ? ' new order arrived!' : ' new orders arrived!');
            banner.style.display = 'block';
            setTimeout(() => { banner.style.display='none'; }, 5000);
            if (navigator.vibrate) navigator.vibrate([200,100,200]);
        }
        lastCount = allOrders.length;

        updateStats(allOrders, completedToday);
        renderCards(allOrders);
        updateFAB();

    } catch(e) {
        if (!silent) list.innerHTML = '<div class="loading" style="color:var(--red)">⚠ Error: ' + e.message + '</div>';
    }
}

// ─── RENDER CARDS ─────────────────────────────────────────────────────────────
function renderCards(orders) {
    const list = document.getElementById('order-list');

    if (!orders.length) {
        list.innerHTML = `<div class="empty-state">
            <div class="empty-icon">🎉</div>
            <div class="empty-title">No pending orders!</div>
            <div class="empty-sub">All orders have been placed.</div>
        </div>`;
        document.getElementById('status-bar').innerText = '';
        return;
    }

    // Sort: review first, then normal
    const sorted = [...orders].sort((a, b) => {
        const aR = (a['Koment shtese (Nese ka)']||'').toString().trim()!=='' || (a.Produkti||'').toString().includes('+');
        const bR = (b['Koment shtese (Nese ka)']||'').toString().trim()!=='' || (b.Produkti||'').toString().includes('+');
        return (bR ? 1 : 0) - (aR ? 1 : 0);
    });

    const selHint = orders.length > 1
        ? '<p class="section-label" style="margin-bottom:10px">Tap to select — you can pick multiple</p>'
        : '<p class="section-label" style="margin-bottom:10px">Orders pending</p>';

    list.innerHTML = selHint + sorted.map(o => buildCard(o)).join('');

    // Attach tap listeners
    sorted.forEach(o => {
        const card = document.getElementById('card-' + o.rowNumber);
        if (card) card.addEventListener('click', () => toggleSelect(o.rowNumber));
    });

    // Restore selected state visually
    selectedRows.forEach(r => {
        const card = document.getElementById('card-' + r);
        if (card) {
            card.classList.add('selected');
            const check = card.querySelector('.card-check');
            if (check) check.innerText = '✓';
        }
    });

    document.getElementById('status-bar').innerText = orders.length + ' orders pending';
}

function buildCard(o) {
    const ap = (o.Produkti||'').toString().trim();
    const ac = (o['Koment shtese (Nese ka)']||'').toString().trim();
    const isReview  = ap.includes('+') || ac !== '';
    const product   = getProduct(ap);
    const isSelected = selectedRows.has(o.rowNumber);

    return `
    <div class="order-card${isReview?' review':''}${isSelected?' selected':''}" id="card-${o.rowNumber}">
        <div class="card-check">${isSelected?'✓':''}</div>
        <div class="card-top">
            <span class="card-badge">#${o.rowNumber}</span>
            <span class="card-label">${isReview ? '⚠️ Needs review' : '🟢 Ready'}</span>
        </div>
        <div class="card-name">${(o.Emri||'').trim()} ${(o.Mbiemri||'').trim()}</div>
        <div class="card-detail"><span class="icon">📦</span><span class="val">${product}</span></div>
        <div class="card-detail"><span class="icon">📍</span><span class="val">${o.Qyteti||'—'}</span></div>
        <div class="card-detail"><span class="icon">📞</span><span class="val">${(o.Telefoni||'').toString().trim()||'—'}</span></div>
        <div class="card-detail"><span class="icon">🏠</span><span class="val">${(o.Adresa||'').toString().trim()||'—'}</span></div>
        ${ap.includes('+') ? `<div class="card-alert alert-multi">⚠️ <span>Multiple products: <b>${ap.split('+').map(c=>c.trim()).join(' + ')}</b></span></div>` : ''}
        ${ac ? `<div class="card-alert alert-comment">💬 <span>${ac}</span></div>` : ''}
    </div>`;
}

// ─── APPROVE SELECTED ─────────────────────────────────────────────────────────
async function approveSelected() {
    if (selectedRows.size === 0) return;

    const btn = document.getElementById('fab-approve-btn');
    btn.disabled  = true;
    btn.innerText = '⏳ Sending...';

    // Build queue from selected orders (preserve sorted order)
    const toProcess = allOrders.filter(o => selectedRows.has(o.rowNumber));
    const total     = toProcess.length;
    let   completed = 0;
    let   failed    = 0;

    // Approve all selected rows at once (write flags to PropertiesService)
    for (const order of toProcess) {
        try {
            const res = await fetch(
                SCRIPT_URL + '?action=approve&row=' + order.rowNumber + '&t=' + Date.now(),
                { redirect: 'follow' }
            );
            let success = false;
            try {
                const data = JSON.parse(await res.text());
                success = data.success === true;
            } catch(e) {
                success = res.status >= 200 && res.status < 400;
            }
            if (!success) failed++;
        } catch(e) {
            failed++;
        }
    }

    // Clear selection visually
    clearSelection();
    btn.disabled  = false;
    btn.innerText = '▶ Place Orders';

    if (failed === 0) {
        // All sent successfully — now poll for results
        showNotif(
            '📤',
            total === 1 ? '1 order sent!' : total + ' orders sent!',
            'Desktop is placing them one by one.\nYou\'ll be notified as each completes.',
            'green'
        );
        // Poll for each order's result
        toProcess.forEach(o => {
            const name    = (o.Emri||'').trim() + ' ' + (o.Mbiemri||'').trim();
            const product = getProduct(o.Produkti||'');
            pollForResult(o.rowNumber, name, product, 0, total);
        });
    } else {
        showNotif(
            '⚠️',
            'Some approvals failed',
            failed + ' of ' + total + ' dështuan.\nProvo përsëri.',
            'red'
        );
    }
}

// ─── POLL FOR RESULT ──────────────────────────────────────────────────────────
function pollForResult(rowNumber, name, product, attempts, total) {
    const MAX = 24; // 24 × 5s = 2 min

    setTimeout(async () => {
        try {
            const res    = await fetch(SCRIPT_URL + '?t=' + Date.now());
            const orders = await res.json();
            const row    = orders.find(o => o.rowNumber == rowNumber);

            if (row) {
                const oid      = (row.OrderID||'').toString().trim();
                const isPlaced = oid !== '' && oid.toLowerCase() !== 'pending';

                if (isPlaced) {
                    addHistory({ rowNumber, name, product }, true, oid);
                    if (navigator.vibrate) navigator.vibrate([80]);
                    // Only show individual notif if single order; for multi just refresh
                    if (total === 1) {
                        showNotif('✅', 'Order placed!',
                            '#' + rowNumber + ' — ' + name + '\n' + product + '\nOrder ID: ' + oid,
                            'green');
                    } else {
                        // Show a brief toast-style banner
                        const banner = document.getElementById('new-order-banner');
                        banner.innerText = '✅ #' + rowNumber + ' ' + name + ' — ' + oid;
                        banner.style.background = 'var(--green)';
                        banner.style.display = 'block';
                        setTimeout(() => { banner.style.display='none'; banner.style.background=''; }, 4000);
                    }
                    loadOrders(true);
                    return;
                }
            }

            if (attempts < MAX) {
                pollForResult(rowNumber, name, product, attempts + 1, total);
            } else {
                addHistory({ rowNumber, name, product }, false, null);
                showNotif('⚠️', 'Timed out',
                    '#' + rowNumber + ' — ' + name + '\nNot confirmed within 2 minutes.\nMake sure Chrome is open on your laptop.',
                    'red');
            }
        } catch(e) {
            if (attempts < MAX) pollForResult(rowNumber, name, product, attempts + 1, total);
        }
    }, 5000);
}

// ─── HISTORY ──────────────────────────────────────────────────────────────────
function addHistory(order, success, orderId) {
    const time = new Date().toLocaleTimeString('sq-AL', {hour:'2-digit', minute:'2-digit'});
    orderHistory.unshift({ ...order, time, success, orderId });
    if (orderHistory.length > 30) orderHistory.pop();
    const c = document.getElementById('history-list');
    if (!c) return;
    c.innerHTML = orderHistory.map(h => `
        <div class="history-item">
            <div class="history-top">
                <span class="history-name">#${h.rowNumber} ${h.name}</span>
                <span class="history-time">${h.time}</span>
            </div>
            <div class="history-bottom">
                <span class="history-product">${h.product}</span>
                <span class="history-result ${h.success?'ok':'err'}">
                    ${h.success ? '✅ ' + (h.orderId||'OK') : '❌ Failed'}
                </span>
            </div>
        </div>`).join('');
}

// ─── AUTO-DETECT NEW ORDERS ───────────────────────────────────────────────────
setInterval(() => loadOrders(true), 60000);

// ─── RELOAD BUTTON ────────────────────────────────────────────────────────────
document.getElementById('reload-btn').addEventListener('click', () => {
    const btn = document.getElementById('reload-btn');
    btn.classList.add('spinning');
    btn.addEventListener('animationend', () => btn.classList.remove('spinning'), { once: true });
    loadOrders();
});

// ─── STARTUP ──────────────────────────────────────────────────────────────────
loadOrders();
</script>
