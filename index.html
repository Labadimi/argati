<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff4500">
    <title>Parts Center</title>
    <link rel="manifest" href="/argati/manifest.json">
    <link rel="apple-touch-icon" href="/argati/icon-192.png">
    <style>
        :root {
            --primary: #ff4500;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #94a3b8;
            --border: #e8ecf0;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1117;
                --card: #1a1d27;
                --text: #e2e8f0;
                --muted: #64748b;
                --border: #2a2d3a;
                --shadow: 0 2px 12px rgba(0,0,0,0.4);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            min-height: 100vh;
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; padding: 8px 0;
            position: sticky; top: 0; background: var(--bg); z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-icon {
            width: 44px; height: 44px; background: var(--primary);
            border-radius: 14px; display: flex; align-items: center;
            justify-content: center; font-size: 22px; color: white;
        }
        .header-title { font-size: 21px; font-weight: 800; }
        .header-sub { font-size: 12px; color: var(--muted); }
        .btn-icon {
            width: 40px; height: 40px; background: var(--card);
            border: 1.5px solid var(--border); border-radius: 12px;
            font-size: 18px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }
        .notif-bar {
            display: flex; align-items: center; gap: 10px;
            background: var(--card); border: 1.5px solid var(--border);
            border-radius: 14px; padding: 12px 14px; margin-bottom: 18px;
            font-size: 13px; font-weight: 600;
        }
        .notif-bar.active { border-color: var(--success); }
        .notif-bar.inactive { border-color: var(--danger); }
        .notif-dot { width: 10px; height: 10px; border-radius: 50%; }
        .active .notif-dot { background: var(--success); }
        .inactive .notif-dot { background: var(--danger); }
        .btn-subscribe {
            margin-left: auto; padding: 9px 16px; border: none;
            border-radius: 10px; font-size: 12px; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
        .btn-subscribe.enable { background: var(--primary); color: white; }
        .btn-subscribe.disable { background: var(--card); color: var(--text); border: 1.5px solid var(--border); }
        .stats-row { display: flex; gap: 10px; margin-bottom: 18px; }
        .stat-box {
            flex: 1; background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 12px 14px; text-align: center;
        }
        .stat-num { font-size: 28px; font-weight: 800; }
        .stat-num.pending { color: #ff4500; }
        .stat-num.done { color: #10b981; }
        .stat-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
        .section-title {
            font-size: 11px; font-weight: 800; color: var(--muted);
            text-transform: uppercase; margin: 20px 0 10px;
            display: flex; align-items: center; gap: 6px;
        }
        .section-count {
            background: var(--primary); color: white; font-size: 10px;
            padding: 2px 8px; border-radius: 10px;
        }
        .order-card {
            background: var(--card); border-radius: 16px; padding: 16px;
            margin-bottom: 12px; border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .order-card.processing { opacity: 0.5; }
        .order-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .order-name-row { display: flex; align-items: center; gap: 8px; }
        .order-name { font-size: 16px; font-weight: 700; }
        .order-row-num {
            background: rgba(255,69,0,0.1); color: var(--primary);
            font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 7px;
        }
        .order-details {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 6px 12px; font-size: 13px; color: #475569; margin-bottom: 10px;
        }
        .detail-item { display: flex; align-items: center; gap: 5px; font-weight: 500; }
        .order-comment {
            background: #fef3c7; padding: 8px 12px; border-radius: 8px;
            font-size: 12px; margin-bottom: 10px;
        }
        .order-action-row { display: flex; gap: 8px; }
        .btn-approve {
            flex: 1; padding: 12px; background: var(--success); color: white;
            border: none; border-radius: 12px; font-size: 14px; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
        .empty-state {
            text-align: center; padding: 40px 24px; color: var(--muted);
            background: var(--card); border-radius: 20px; border: 1px solid var(--border);
        }
        .empty-icon { font-size: 52px; margin-bottom: 12px; }
        .empty-title { font-size: 18px; font-weight: 700; color: var(--text); }
        #toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #0f172a; color: white; padding: 12px 24px;
            border-radius: 24px; font-size: 13px; font-weight: 600;
            opacity: 0; transition: opacity 0.3s; z-index: 999;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-icon">🤖</div>
            <div>
                <div class="header-title">Argati</div>
                <div class="header-sub">Order Dashboard</div>
            </div>
        </div>
        <button class="btn-icon" onclick="loadOrders()">🔄</button>
    </div>

    <div class="notif-bar inactive" id="notif-bar">
        <div class="notif-dot"></div>
        <span id="notif-text">Kliko për të aktivizuar</span>
        <button class="btn-subscribe enable" id="subscribe-btn">🔔 Aktivizo</button>
    </div>

    <div class="stats-row">
        <div class="stat-box">
            <div class="stat-num pending" id="stat-pending">—</div>
            <div class="stat-label">Në Pritje</div>
        </div>
        <div class="stat-box">
            <div class="stat-num done" id="stat-done">—</div>
            <div class="stat-label">Sot ✅</div>
        </div>
    </div>

    <div class="section-title">📋 Porositë në Pritje <span class="section-count" id="pending-count">0</span></div>
    <div id="pending-orders"><div style="text-align:center;padding:32px;">Duke u ngarkuar...</div></div>
    <div id="toast"></div>
    <script src="/argati/app.js"></script>
</body>
</html>
