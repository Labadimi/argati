<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff4500">
    <title>Parts Center Orders</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --primary: #ff4500;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #94a3b8;
            --border: #e8ecf0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── HEADER ──────────────────────────────────────────────────────── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 12px 0;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-icon {
            width: 40px; height: 40px;
            background: var(--primary);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: white;
        }
        .header-title {
            font-size: 20px; font-weight: 800;
            line-height: 1.2;
        }
        .header-sub {
            font-size: 11px; color: var(--muted); font-weight: 500;
        }

        /* ─── NOTIFICATION STATUS ─────────────────────────────────────────── */
        .notif-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 12px;
            font-weight: 600;
        }
        .notif-status.active { border-color: var(--success); background: #f0fdf4; }
        .notif-status.inactive { border-color: var(--danger); background: #fef2f2; }
        .notif-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .active .notif-dot { background: var(--success); }
        .inactive .notif-dot { background: var(--danger); }

        /* ─── BUTTONS ─────────────────────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(255,69,0,0.25);
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        /* ─── ORDER CARDS ─────────────────────────────────────────────────── */
        .section-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 16px 0 10px;
        }
        .order-card {
            background: var(--card);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: transform 0.15s;
        }
        .order-card:active { transform: scale(0.99); }
        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .order-name {
            font-size: 15px;
            font-weight: 700;
        }
        .order-row {
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
        }
        .order-details {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            font-size: 12px;
            color: #475569;
            margin-bottom: 10px;
        }
        .order-detail-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .order-actions {
            display: flex;
            gap: 8px;
        }
        .btn-approve {
            flex: 1;
            padding: 10px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-approve:active { opacity: 0.8; transform: scale(0.97); }
        .btn-skip {
            padding: 10px 14px;
            background: var(--card);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* ─── EMPTY STATE ─────────────────────────────────────────────────── */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }
        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .empty-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        /* ─── LOADING ─────────────────────────────────────────────────────── */
        .loading {
            text-align: center;
            padding: 20px;
            color: var(--muted);
        }
        .spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── TOAST ───────────────────────────────────────────────────────── */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="header-icon">📦</div>
            <div>
                <div class="header-title">Parts Center</div>
                <div class="header-sub">Order Notifications</div>
            </div>
        </div>
        <button class="btn btn-secondary" id="refresh-btn" onclick="loadOrders()">
            🔄 Refresh
        </button>
    </div>

    <!-- NOTIFICATION STATUS -->
    <div class="notif-status inactive" id="notif-status">
        <div class="notif-dot"></div>
        <span id="notif-text">Notifications inactive</span>
        <button class="btn btn-primary" id="subscribe-btn" style="margin-left:auto; padding:8px 14px; font-size:11px;">
            🔔 Enable
        </button>
    </div>

    <!-- PENDING ORDERS -->
    <div class="section-title">📋 Pending Orders</div>
    <div id="pending-orders">
        <div class="loading"><div class="spinner"></div></div>
    </div>

    <!-- TOAST -->
    <div id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
