<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Argati">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Argati</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* ═══ 1. Tokens ══════════════════════════════════════════════════════════════
   Safe areas live in variables so every component uses the same source of truth
   (iPhone 15 Pro standalone: top 59pt under the Dynamic Island, bottom 34pt). */
:root{
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --nav-h:44px; --dock-h:64px; --dock-gap:8px; --gutter:16px;

  /* iOS light: grouped background, white cells */
  --bg:#F2F2F7; --cell:#FFFFFF; --cell-2:#F2F2F7; --fill:rgba(120,120,128,.12); --fill-strong:rgba(120,120,128,.2);
  --label:#000000; --label-2:rgba(60,60,67,.62); --label-3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.18); --stroke:rgba(0,0,0,.06);
  --material:rgba(249,249,251,.72); --material-strong:rgba(249,249,251,.88);
  --accent:#FF4D0D; --accent-text:#D23C02; --on-accent:#FFFFFF;
  --green:#34C759; --green-text:#1F7A37; --amber:#FF9F0A; --amber-text:#995C00;
  --blue:#007AFF;  --blue-text:#0062CC; --red:#FF3B30; --red-text:#D70015; --gray:#8E8E93;
  --shadow-dock:0 10px 30px rgba(0,0,0,.12),0 1px 0 rgba(255,255,255,.6) inset;
  --spring:cubic-bezier(.2,.8,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    /* True black for the OLED panel; elevation via the iOS dark tiers */
    --bg:#000000; --cell:#1C1C1E; --cell-2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill-strong:rgba(118,118,128,.36);
    --label:#FFFFFF; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6); --stroke:rgba(255,255,255,.1);
    --material:rgba(22,22,24,.68); --material-strong:rgba(28,28,30,.86);
    --accent:#FF6A33; --accent-text:#FF8A5C; --on-accent:#FFFFFF;
    --green:#30D158; --green-text:#30D158; --amber:#FFB340; --amber-text:#FFB340;
    --blue:#0A84FF; --blue-text:#409CFF; --red:#FF453A; --red-text:#FF6961; --gray:#8E8E93;
    --shadow-dock:0 10px 30px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06) inset;
  }
}

/* ═══ 2. iOS standalone reset ═══════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{height:100vh;height:100lvh;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{position:relative}
body.sheet-open{background:#000}
body{font:400 17px/1.29 var(--font);letter-spacing:-.41px;color:var(--label);-webkit-font-smoothing:antialiased}
button,a,label,[role="button"],.no-select,nav,header{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit;text-decoration:none}
img,svg{display:block}
.selectable,.selectable *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
:focus{outline:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ═══ 3. Utilities: safe areas + materials ══════════════════════════════════ */
.pt-safe{padding-top:var(--sat)} .pb-safe{padding-bottom:var(--sab)}
.px-safe{padding-left:max(var(--gutter),var(--sal));padding-right:max(var(--gutter),var(--sar))}
.glass{background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.glass-strong{background:var(--material-strong);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px)}
.hairline{box-shadow:0 .5px 0 var(--sep)}
.press{transition:transform .32s var(--spring),background-color .2s,opacity .2s;will-change:transform}
.press:active{transform:scale(.97)}
.hit{position:relative}
.hit::after{content:"";position:absolute;inset:-6px}          /* grows any control to ≥44pt */

/* ═══ 4. App frame (scales back when a sheet opens, like iOS card presentation) */
#frame{position:absolute;inset:0;background:var(--bg);overflow:hidden;transform-origin:50% 0;
  transition:transform .42s var(--spring),border-radius .42s var(--spring),filter .42s}
body.sheet-open #frame{transform:translateY(calc(var(--sat) * .5 + 6px)) scale(.93);border-radius:14px;filter:brightness(.82)}

/* Nav bar: transparent at rest, glass once content scrolls under it */
#nav{position:absolute;left:0;right:0;top:0;z-index:30;padding-top:var(--sat);transition:background-color .25s,box-shadow .25s}
#nav.scrolled{background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.navbar{height:var(--nav-h);display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nav-left{font:600 17px/1 var(--font);letter-spacing:-.41px;justify-self:start}
.nav-title{font:600 17px/1 var(--font);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;white-space:nowrap}
#nav.compact .nav-title{opacity:1;transform:none}
.nav-right{justify-self:end;display:flex;align-items:center;gap:6px}
.pill{height:30px;display:inline-flex;align-items:center;gap:7px;padding:0 12px 0 10px;border-radius:15px;background:var(--fill);font:500 15px/1 var(--font);letter-spacing:-.24px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray);flex:0 0 auto}
.dot.on{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.dot.off{background:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 25%,transparent)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;font-size:22px;color:var(--accent-text)}
.icon-btn:active{background:var(--fill)}
.spin{animation:spin .9s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}

/* Scroll view sits under the nav and above the dock */
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding-top:calc(var(--sat) + var(--nav-h));padding-bottom:calc(var(--sab) + var(--dock-h) + var(--dock-gap) + 24px)}
#content{position:relative;max-width:680px;margin:0 auto}
#ptr{position:absolute;left:50%;top:-46px;width:28px;height:28px;margin-left:-14px;display:grid;place-items:center;color:var(--label-2);font-size:22px;opacity:0;transition:opacity .15s}

/* ═══ 5. Typography (Apple type scale) ══════════════════════════════════════ */
.large-title{font:700 34px/41px var(--font);letter-spacing:.37px;padding-top:4px}
.large-title.attn{color:var(--accent-text)} .large-title.bad{color:var(--red-text)}
.subhead{font:400 15px/20px var(--font);letter-spacing:-.24px;color:var(--label-2);margin-top:6px}
.subhead b{font-weight:600;color:var(--label)}
.section-title{font:700 22px/28px var(--font);letter-spacing:.35px;margin:28px 4px 10px;display:flex;align-items:baseline;gap:8px}
.section-title .count{font:600 17px/1 var(--font);color:var(--label-2)}
.footnote{font:400 13px/18px var(--font);letter-spacing:-.08px;color:var(--label-2);margin:8px 16px 0}
.footnote a{color:var(--accent-text);font-weight:500}

/* ═══ 6. Inset grouped lists ════════════════════════════════════════════════ */
.group{background:var(--cell);border-radius:20px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;text-align:left;background:var(--cell)}
.cell + .cell::before{content:"";position:absolute;top:0;right:0;left:62px;height:.5px;background:var(--sep)}
.cell.plain + .cell.plain::before{left:16px}
button.cell:active,a.cell:active,.cell[role="button"]:active{background:var(--cell-2)}
.cell .body{flex:1;min-width:0}
.cell .title{font:600 17px/22px var(--font);display:flex;align-items:center;gap:8px;min-width:0}
.cell .title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .sub{font:400 15px/20px var(--font);letter-spacing:-.24px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .why{font:400 15px/20px var(--font);letter-spacing:-.24px;margin-top:3px}
.cell .why b{font-weight:600}
.cell .chev{color:var(--label-3);font-size:20px;flex:0 0 auto}
.cell .value{font:400 17px/22px var(--font);color:var(--label-2)}
.code{font:600 12px/1 var(--font);letter-spacing:.2px;color:var(--label-2);padding:4px 6px;border-radius:6px;background:var(--fill);flex:0 0 auto}

/* Leading icon tiles (Settings-app style) carry the state colour */
.tile{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:19px;flex:0 0 auto;align-self:flex-start;margin-top:2px}
.t-accent{--tone:var(--accent);--tone-text:var(--accent-text)} .t-red{--tone:var(--red);--tone-text:var(--red-text)}
.t-blue{--tone:var(--blue);--tone-text:var(--blue-text)} .t-amber{--tone:var(--amber);--tone-text:var(--amber-text)}
.t-green{--tone:var(--green);--tone-text:var(--green-text)} .t-gray{--tone:var(--gray);--tone-text:var(--label-2)}
.tile{background:var(--tone)} .tone-text{color:var(--tone-text)}

/* Countdown ring */
.ring{--p:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;align-self:flex-start;margin-top:2px;
  background:conic-gradient(var(--amber) calc(var(--p)*1%),color-mix(in srgb,var(--amber) 22%,transparent) 0)}
.ring::after{content:"";grid-area:1/1;width:25px;height:25px;border-radius:50%;background:var(--cell)}
.ring span{grid-area:1/1;z-index:1;font:600 10px/1 var(--font);letter-spacing:0}
.ring.big{width:40px;height:40px;margin:0} .ring.big::after{width:32px;height:32px} .ring.big span{font-size:11px}

/* ═══ 7. Buttons + controls ═════════════════════════════════════════════════ */
.btn{min-height:44px;padding:0 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 17px/1 var(--font);letter-spacing:-.41px;white-space:nowrap}
.btn.small{min-height:34px;padding:0 14px;border-radius:17px;font-size:15px;letter-spacing:-.24px}
.btn.filled{background:var(--accent);color:var(--on-accent)}
.btn.tinted{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-text)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.danger{background:var(--red);color:#fff}
.btn.block{width:100%;min-height:50px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip-ok{font:600 13px/1 var(--font);padding:7px 10px;border-radius:14px;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green-text);flex:0 0 auto}

.switch{position:relative;width:51px;height:31px;flex:0 0 auto}
.switch input{position:absolute;inset:-7px;opacity:0;z-index:1;cursor:pointer;width:65px;height:45px}
.switch .tr{position:absolute;inset:0;border-radius:16px;background:var(--fill-strong);transition:background .25s}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .32s var(--spring)}
.switch input:checked+.tr{background:var(--green)}
.switch input:checked+.tr::after{transform:translateX(20px)}
.switch input:focus-visible+.tr{outline:2px solid var(--blue);outline-offset:2px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border-radius:9px;background:var(--fill);margin-top:10px;position:relative}
.seg button{min-height:32px;border-radius:7px;font:500 13px/1 var(--font);letter-spacing:-.08px;color:var(--label);position:relative}
.seg button::after{content:"";position:absolute;inset:-6px 0}
.seg button[aria-pressed="true"]{background:var(--cell);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme: dark){.seg button[aria-pressed="true"]{background:#636366}}

.field{display:block;padding:12px 16px}
.field + .field{box-shadow:0 -.5px 0 var(--sep)}
.field span{display:block;font:400 13px/18px var(--font);color:var(--label-2);margin-bottom:6px}
.field input{width:100%;height:44px;border:0;border-radius:10px;background:var(--fill);padding:0 12px;font-size:17px}
.search{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;background:var(--fill);margin:4px 0 6px}
.search i{color:var(--label-2);font-size:18px}
.search input{flex:1;min-width:0;border:0;background:none;font-size:17px;height:36px}
.search input::placeholder{color:var(--label-2)}

/* ═══ 8. Queue hero: countdown chips ═══════════════════════════════════════ */
.track{display:flex;gap:10px;overflow-x:auto;margin:16px calc(-1 * var(--gutter)) 0;padding:2px var(--gutter) 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.track::-webkit-scrollbar{display:none}
.tick{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 16px 8px 8px;border-radius:28px;background:var(--cell);text-align:left}
.tick .who{font:600 15px/18px var(--font);letter-spacing:-.24px}
.tick .what{font:400 13px/16px var(--font);color:var(--label-2)}

/* Banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:20px;margin:12px 0 0;font:400 15px/20px var(--font);letter-spacing:-.24px;
  background:color-mix(in srgb,var(--red) 12%,var(--cell));color:var(--label)}
.banner i{font-size:22px;color:var(--red-text)}
.banner b{font-weight:600}
.banner .btn{margin-left:auto}

/* Insights */
.figures{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.fig{background:var(--cell);border-radius:20px;padding:14px}
.fig .k{font:400 13px/18px var(--font);color:var(--label-2)}
.fig .v{font:700 28px/34px var(--font);letter-spacing:.36px;margin-top:2px}
.fig .m{font:400 13px/18px var(--font);color:var(--label-2)}
.chart{padding:16px 12px 10px}
.chart svg{width:100%;height:auto}
.chart .axis{font:500 11px var(--font);fill:var(--label-2)}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 16px;position:relative}
.bar-row + .bar-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.bar-row .label{font:400 17px/22px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .val{font:600 17px/22px var(--font);color:var(--label-2)}
.bar-row .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar-row .bar i{display:block;height:100%;border-radius:3px;background:var(--gray)}
.bar-row:first-child .bar i{background:var(--accent)}

/* Empty states */
.empty{display:flex;gap:14px;align-items:center;padding:16px}
.empty .tile{align-self:center;margin:0}
.empty b{display:block;font:600 17px/22px var(--font)}
.empty p{font:400 15px/20px var(--font);color:var(--label-2)}

/* ═══ 9. Floating dock ══════════════════════════════════════════════════════ */
#dock{position:absolute;z-index:40;left:max(14px,var(--sal));right:max(14px,var(--sar));bottom:calc(var(--sab) + var(--dock-gap));
  height:var(--dock-h);border-radius:32px;box-shadow:var(--shadow-dock);border:.5px solid var(--stroke);max-width:520px;margin:0 auto}
#dock .items{position:relative;height:100%;display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
#dock .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:26px;background:var(--fill);
  transform:translateX(calc(var(--i,0) * 100%));transition:transform .45s var(--spring)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:26px;
  font:500 10px/12px var(--font);letter-spacing:.1px;color:var(--label-2);transition:color .2s,transform .32s var(--spring)}
.tab i{font-size:25px;line-height:1}
.tab:active{transform:scale(.92)}
.tab[aria-current="page"]{color:var(--accent-text)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;
  font:600 12px/18px var(--font);text-align:center}

/* ═══ 10. Bottom sheet ══════════════════════════════════════════════════════ */
#scrim{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .35s}
body.sheet-open #scrim{opacity:1;pointer-events:auto}
#sheet{position:absolute;z-index:51;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;display:flex;flex-direction:column;
  max-height:calc(100% - var(--sat) - 10px);background:var(--bg);border-radius:28px 28px 0 0;
  transform:translateY(105%);visibility:hidden;transition:transform .45s var(--spring),visibility 0s linear .45s;touch-action:pan-y}
body.sheet-open #sheet{transform:translateY(var(--drag,0px));visibility:visible;transition:transform .45s var(--spring)}
#sheet.dragging{transition:none!important}
.sheet-head{padding:8px 16px 4px;cursor:grab}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:0 auto 10px}
.sheet-top{display:flex;align-items:flex-start;gap:12px}
.sheet-top h3{flex:1;font:700 22px/28px var(--font);letter-spacing:.35px}
.sheet-top .sub{font:400 15px/20px var(--font);color:var(--label-2);margin-top:2px}
.close-btn{width:30px;height:30px;border-radius:15px;background:var(--fill);color:var(--label-2);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 16px 16px;flex:1}
.sheet-foot{padding:10px 16px calc(var(--sab) + 12px);display:grid;gap:10px;background:var(--bg)}
.sheet-foot:empty{padding-top:0}
.status-card{border-radius:20px;padding:14px 16px;background:color-mix(in srgb,var(--tone) 13%,var(--cell));margin:6px 0 14px}
.status-card .state{font:600 15px/20px var(--font);color:var(--tone-text)}
.status-card p{font:400 15px/20px var(--font);margin-top:2px}
.warnline{font:400 15px/20px var(--font);color:var(--red-text);text-align:center}
.cell a.link,.cell .link{color:var(--blue-text)}

/* Toast (above the dock, inside the thumb zone) */
#toast{position:absolute;z-index:60;left:0;right:0;margin:0 auto;width:fit-content;bottom:calc(var(--sab) + var(--dock-h) + var(--dock-gap) + 14px);transform:translateY(16px) scale(.96);
  max-width:calc(100% - 40px);text-align:center;padding:12px 18px;border-radius:22px;font:500 15px/20px var(--font);letter-spacing:-.24px;color:var(--label);
  box-shadow:0 8px 24px rgba(0,0,0,.18);border:.5px solid var(--stroke);opacity:0;pointer-events:none;transition:opacity .25s,transform .4s var(--spring)}
#toast.show{opacity:1;transform:none}
body.sheet-open #toast{bottom:auto;top:calc(var(--sat) + 10px);transform:translateY(-16px) scale(.96)}
body.sheet-open #toast.show{transform:none}

/* Setup */
.setup{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding-top:24px;padding-bottom:8px}
.setup .tile{width:64px;height:64px;border-radius:16px;font-size:34px;margin:0 0 6px}
.setup p{font:400 17px/22px var(--font);color:var(--label-2)}
.err{font:400 15px/20px var(--font);color:var(--red-text);min-height:20px;padding:0 4px}

/* Tab transitions */
@keyframes in-right{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes in-left{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
#content.in-right{animation:in-right .34s var(--spring)} #content.in-left{animation:in-left .34s var(--spring)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  body.sheet-open #frame{transform:none;filter:brightness(.85)}
}

</head>
<body>
<div id="frame">
  <header id="nav"></header>
  <main id="view"><div id="content"></div></main>
  <nav id="dock" class="glass" aria-label="Sections" hidden><div class="items"></div></nav>
</div>
<div id="scrim"></div>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true"></section>
<div id="toast" class="glass-strong" role="status" aria-live="polite"></div>
<script>
'use strict';
const APP_VERSION = '4.0.1';
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbzQMxhghzC2LCW36uaUJTlOI4WxHV6h8snnhRPRBgSM6fXeyG8LZS67Pzxoet41wes/exec';
const VAPID_PUBLIC = 'BPMuB6Ef73ZeI70auGOSVXz1DUz5GW2CDCzh0S-ecMFiyrhjVQv6OyF48qm-Kd_tKeyBqj7E1ZrYYHpR7KtKeuQ';
const POLL_MS = 15000;
const quietMs = () => 1000 * Number(((S.pending || {}).settings || {}).quietSeconds || 120);
const DEMO = new URLSearchParams(location.search).has('demo');
const store = {
  get() { try { return JSON.parse(localStorage.getItem('argati.v3') || '{}'); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem('argati.v3', JSON.stringify(v)); } catch (e) {} }
};
let cfg = Object.assign({ url: DEFAULT_URL, key: '' }, store.get());

const S = { tab: 'queue', status: null, pending: null, recent: [], recentAt: 0, offset: 0, lastOk: 0,
            error: '', loading: false, approved: {}, open: null, query: '' };

const STATES = {
  review:      { label: 'Needs approval',      tone: 'flame',  group: 'needs' },
  unverified:  { label: 'Check back office',   tone: 'stop',   group: 'needs' },
  manual:      { label: 'Place manually',      tone: 'manual', group: 'needs' },
  blocked:     { label: 'Fix in the sheet',    tone: 'stop',   group: 'needs' },
  waiting:     { label: 'Counting down',       tone: 'wait',   group: 'soon' },
  retry:       { label: 'Retrying',            tone: 'wait',   group: 'soon' },
  ready:       { label: 'Ready to place',      tone: 'ok',     group: 'soon' },
  would_place: { label: 'Would place (test mode)', tone: 'ok', group: 'soon' },
  writing:     { label: 'Writing to the sheet', tone: 'ok',    group: 'soon' },
  placed:      { label: 'Placed',              tone: 'ok',     group: 'soon' },
  out_of_stock:{ label: 'Waiting for stock',   tone: 'wait',   group: 'soon' },
  unknown:     { label: 'Not checked yet',     tone: 'steel',  group: 'soon' },
};

// ── Helpers ────────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '€' + (Math.round(n * 100) / 100).toFixed(2);
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const serverNow = () => Date.now() + S.offset;
const parseMoney = s => { const n = parseFloat(String(s || '').replace(/[^\d.,-]/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const dayKey = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
function ago(sec) {
  if (sec == null) return 'never';
  if (sec >= 86400) return Math.round(sec / 86400) + ' d ago';
  if (sec < 60) return sec + 's ago';
  if (sec < 3600) return Math.round(sec / 60) + ' min ago';
  return Math.round(sec / 3600) + ' h ago';
}
function clock(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

// ── API ────────────────────────────────────────────────────────────────────
class ApiError extends Error {}
async function call(method, action, body) {
  if (DEMO) return Demo.handle(method, action, body);
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      let res;
      if (method === 'GET') {
        const qs = new URLSearchParams(Object.assign({ action, key: cfg.key, t: Date.now() }, body || {}));
        res = await fetch(cfg.url + '?' + qs, { cache: 'no-store' });
      } else {
        res = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                     body: JSON.stringify(Object.assign({ action, key: cfg.key }, body || {})) });
      }
      const text = (await res.text()).trim();
      if (text.startsWith('<')) throw new ApiError('Google returned an error page');
      const data = JSON.parse(text);
      if (data.error === 'unauthorized') throw Object.assign(new ApiError('The access key was rejected'), { fatal: true });
      if (data.ok === false && /^(busy|server)/.test(data.error || '')) throw new ApiError(data.error);
      if (data.ok === false) throw Object.assign(new ApiError(data.error || 'Request failed'), { fatal: true });
      return data;
    } catch (e) {
      lastErr = e;
      if (e.fatal) break;
      await new Promise(r => setTimeout(r, 900 * (attempt + 1)));
    }
  }
  throw lastErr instanceof ApiError ? lastErr : new ApiError("Can't reach the sheet");
}
const get = (a, p) => call('GET', a, p);
const post = (a, b) => call('POST', a, b);

// ── Data ───────────────────────────────────────────────────────────────────
async function refresh(force) {
  if (S.loading || (!cfg.key && !DEMO)) return;
  S.loading = true; render();
  try {
    let status, pending;
    try {
      const d = await get('dash');
      status = d.status; pending = d.pending; S.today = d.today || null;
    } catch (e) {
      if (!/unknown action/.test(e.message)) throw e;
      [status, pending] = await Promise.all([get('status'), get('pending')]); S.today = null;
    }
    S.status = status; S.pending = pending; S.offset = (pending.now || Date.now()) - Date.now();
    S.lastOk = Date.now(); S.error = '';
    if (force || S.tab !== 'queue' || Date.now() - S.recentAt > 60000) await refreshRecent();
    tellWorker();
  } catch (e) {
    S.error = e.message || "Can't reach the sheet";
  }
  S.loading = false; render();
}
async function refreshRecent() {
  try { const r = await get('recent', { limit: 300 }); S.recent = r.orders || []; S.recentAt = Date.now(); } catch (e) {}
}

function products() {
  const m = {};
  ((S.pending && S.pending.products) || []).forEach(p => m[p.code] = p);
  return m;
}
function productLabel(code) {
  const m = products(); code = String(code || '').trim();
  if (m[code]) return m[code].name;
  if (code.includes('+')) return code.split('+').map(c => (m[c.trim()] || {}).name || c.trim()).join(' + ');
  return code || 'No product';
}
function items() {
  if (!S.pending) return [];
  const verdicts = {};
  (((S.status || {}).state || {}).verdicts || []).forEach(v => verdicts[v.row] = v);
  const now = serverNow();
  return (S.pending.rows || []).map(r => {
    const v = verdicts[r.row] || { state: 'unknown', reason: 'The runner hasn’t looked at this row yet.' };
    let state = v.state, reason = humanReason(v.state, v.reason);
    const until = r.lastEdit ? r.lastEdit + quietMs() : 0;
    if (until > now && !['manual', 'blocked'].includes(state)) { state = 'waiting'; reason = 'Waiting until edits stop'; }
    if (state === 'waiting' && until <= now) reason = 'Placing on the next check';
    return Object.assign({}, r, { state, reason, until, qty: v.qty || 1, productName: v.productName || productLabel(r.product),
                                  city: v.city || r.city, name: (r.first + ' ' + r.last).trim() || 'No name',
                                  approved: S.approved[r.row] && Date.now() - S.approved[r.row] < 180000 });
  });
}
function todayStats() {
  if (S.today) return { n: S.today.count, sum: S.today.revenue, last: S.today.last };
  const today = dayKey(new Date()); let n = 0, sum = 0;
  S.recent.forEach(o => { const d = new Date(o.placedAt); if (!isNaN(d) && dayKey(d) === today) { n++; sum += parseMoney(o.total); } });
  return { n, sum, last: S.recent[0] || null };
}

function humanReason(state, reason) {
  const r = String(reason || '');
  if (state === 'manual') return 'Two products, not a GjirafaMall bundle. Place it on the site, then add the Order ID.';
  if (/^Older row/.test(r)) return 'Entered before automatic ordering started. Approve to place it.';
  if (/^Has note:/.test(r)) return 'Has a note the runner can’t act on. Read it, then approve.';
  if (/^Clean/.test(r)) return 'Everything checks out. Waiting for automatic ordering or your approval.';
  if (/^Shadow/.test(r)) return 'Test mode is on, so nothing is sent to GjirafaMall.';
  if (/^Pending for/.test(r)) return 'This row has waited for days. Approve to place it anyway.';
  if (/^Unverified send/.test(r)) return 'It was sent, but no Order ID came back. Check the back office first.';
  if (/^Possible duplicate of/.test(r)) return r.replace('Possible duplicate of', 'Same customer and product as').replace(/\)$/, ')') + '. Approve only if they ordered again.';
  if (/^No price on product page/.test(r)) return 'The product page shows €0.00, so it can’t be ordered right now.';
  return r;
}


// ── Platform: standalone detection + haptics ────────────────────────────────
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
document.documentElement.classList.toggle('standalone', STANDALONE);
document.documentElement.classList.toggle('ios', IS_IOS);

const Haptics = (() => {
  // iOS Safari has no navigator.vibrate. On Safari 18+, toggling a native <input switch>
  // plays the system haptic, so a hidden one is clicked instead (must run inside a tap).
  const canVibrate = typeof navigator.vibrate === 'function';
  let label = null;
  function iosTick() {
    if (!label) {
      label = document.createElement('label');
      label.setAttribute('aria-hidden', 'true');
      label.style.cssText = 'position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
      const input = document.createElement('input');
      input.type = 'checkbox'; input.setAttribute('switch', ''); input.tabIndex = -1;
      label.appendChild(input); document.body.appendChild(label);
    }
    label.click();
  }
  const run = p => { try { if (canVibrate) navigator.vibrate(p); else if (IS_IOS) iosTick(); } catch (e) {} };
  return { tap: () => run(10), select: () => run(8), success: () => run([10, 50, 14]), warning: () => run([24, 60, 24]) };
})();
const haptic = Haptics.tap;

// ── Look of each state ───────────────────────────────────────────────────────
const LOOK = {
  review: ['ti-user-check', 't-accent'], unverified: ['ti-help-hexagon', 't-red'], manual: ['ti-shopping-cart', 't-blue'],
  blocked: ['ti-alert-triangle', 't-red'], waiting: [null, 't-amber'], retry: ['ti-refresh', 't-amber'],
  ready: ['ti-player-play', 't-green'], would_place: ['ti-flask', 't-green'], writing: ['ti-pencil', 't-green'],
  placed: ['ti-check', 't-green'], out_of_stock: ['ti-package-off', 't-amber'], unknown: ['ti-clock', 't-gray'],
};
const TABS = [['queue', 'ti-list-check', 'Queue'], ['placed', 'ti-receipt', 'Placed'],
              ['insights', 'ti-chart-bar', 'Insights'], ['settings', 'ti-settings', 'Settings']];
const TITLE = { queue: 'Queue', placed: 'Placed', insights: 'Insights', settings: 'Settings' };

// ── Render ───────────────────────────────────────────────────────────────────
function runnerInfo() {
  const st = S.status, r = st && st.runner, online = !!(r && r.online);
  const text = !st ? 'Connecting' : online ? (st.state && st.state.mode === 'shadow' ? 'Test mode' : 'Running')
             : r && r.seenAgoSec != null ? 'Offline' : 'No runner';
  return { online, text, known: !!st };
}
function renderNav(minimal) {
  const ri = runnerInfo();
  $('#nav').innerHTML = `<div class="navbar px-safe">
    <div class="nav-left">Argati</div>
    <div class="nav-title">${minimal ? '' : TITLE[S.tab]}</div>
    <div class="nav-right">${minimal ? '' : `
      <button class="pill press" data-act="tab" data-tab="settings" aria-label="Runner status: ${esc(ri.text)}">
        <span class="dot ${ri.online ? 'on' : ri.known ? 'off' : ''}"></span>${esc(ri.text)}</button>
      ${TOUCH ? '' : `<button class="icon-btn" data-act="refresh" aria-label="Refresh"><i class="ti ti-refresh ${S.loading ? 'spin' : ''}"></i></button>`}`}
    </div></div>`;
}
function renderDock(badge) {
  const dock = $('#dock'), wrap = dock.querySelector('.items');
  dock.hidden = false;
  if (!wrap.dataset.built) {
    wrap.innerHTML = '<span class="ind" aria-hidden="true"></span>' + TABS.map(([id, icon, label]) =>
      `<button class="tab" data-act="tab" data-tab="${id}"><i class="ti ${icon}" aria-hidden="true"></i><span>${label}</span></button>`).join('');
    wrap.dataset.built = '1';
  }
  wrap.style.setProperty('--i', TABS.findIndex(t => t[0] === S.tab));
  wrap.querySelectorAll('.tab').forEach(b => {
    b.dataset.tab === S.tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
    const n = b.dataset.tab === 'queue' ? badge : 0;
    let el = b.querySelector('.badge');
    if (n) { if (!el) { el = document.createElement('span'); el.className = 'badge'; b.appendChild(el); } el.textContent = n; }
    else if (el) el.remove();
  });
}

function render() {
  if (!cfg.key && !DEMO) return renderSetup();
  const list = items();
  const needs = list.filter(i => (STATES[i.state] || {}).group === 'needs');
  const soon = list.filter(i => (STATES[i.state] || STATES.unknown).group !== 'needs');
  document.title = needs.length ? `(${needs.length}) Argati` : 'Argati';
  try { if (navigator.setAppBadge) needs.length ? navigator.setAppBadge(needs.length) : navigator.clearAppBadge(); } catch (e) {}
  renderNav(false);
  renderDock(needs.length);
  const views = { queue: () => viewQueue(needs, soon), placed: viewPlaced, insights: viewInsights, settings: viewSettings };
  $('#content').innerHTML = `<div id="ptr" aria-hidden="true"><i class="ti ti-refresh"></i></div>` + views[S.tab]();
  tickCountdowns();
  updateNavState();
  if (Sheet.kind === 'order') Sheet.refreshOrder();
}

function errorBanner() {
  if (!S.error) return '';
  return `<div class="banner" role="alert"><i class="ti ti-cloud-off"></i><div><b>${esc(S.error)}.</b>
    ${S.lastOk ? ' Showing data from ' + ago(Math.round((Date.now() - S.lastOk) / 1000)) + '.' : ''}</div>
    <button class="btn small tinted" data-act="refresh">Retry</button></div>`;
}
function headline(needs, soon) {
  const st = S.status;
  if (!st) return { text: 'Connecting to the sheet…', cls: '' };
  const r = st.runner || {};
  if (!r.online) return { text: r.seenAgoSec != null ? 'The runner is offline.' : 'No runner has connected yet.', cls: 'bad' };
  if (!st.autoMode) return { text: 'Automatic ordering is paused.', cls: 'attn' };
  if (needs.length) return { text: plural(needs.length, 'order needs you.', 'orders need you.'), cls: 'attn' };
  const waiting = soon.filter(i => i.state === 'waiting').length;
  if (waiting) return { text: `Placing ${plural(waiting, 'order', 'orders')} shortly.`, cls: '' };
  return { text: 'All clear.', cls: '' };
}
function viewQueue(needs, soon) {
  const h = headline(needs, soon), t = todayStats(), st = S.status;
  const waiting = soon.filter(i => i.state === 'waiting').sort((a, b) => a.until - b.until);
  let sub;
  if (st && st.runner && !st.runner.online && st.runner.seenAgoSec != null)
    sub = `Last seen ${ago(st.runner.seenAgoSec)}. Orders aren’t being placed. Check that the office Mac is awake and online.`;
  else if (st && !st.autoMode) sub = 'Clean orders wait for your approval. Turn it back on in Settings.';
  else {
    sub = `<b class="num">${t.n}</b> placed today${t.sum ? `, <b class="num">${money(t.sum)}</b>` : ''}.`;
    const d = t.last && new Date(t.last.placedAt);
    if (t.last && !isNaN(d)) sub += ` Last: ${esc(t.last.name)}, ${ago(Math.max(0, Math.round((Date.now() - d) / 1000)))}.`;
  }
  const empty = `<div class="empty"><span class="tile t-green"><i class="ti ti-check"></i></span>
    <div><b>Nothing waiting for you</b><p>Approvals, problems and manual orders show up here.</p></div></div>`;
  return `<div class="px-safe">
    <h1 class="large-title ${h.cls}" id="lt" aria-live="polite">${esc(h.text)}</h1>
    <p class="subhead">${sub}</p>
    ${errorBanner()}
    ${waiting.length ? `<div class="track" aria-label="Orders counting down">${waiting.map(i => `
      <button class="tick press" data-act="open" data-row="${i.row}">
        <span class="ring big" data-until="${i.until}"><span class="num">--</span></span>
        <span><span class="who" style="display:block">${esc(i.first || i.name)}</span>
        <span class="what" style="display:block">${esc(i.product)}${i.qty > 1 ? ' ×' + i.qty : ''}</span></span>
      </button>`).join('')}</div>` : ''}
    <h2 class="section-title">Needs you${needs.length ? `<span class="count num">${needs.length}</span>` : ''}</h2>
    <div class="group">${needs.length ? needs.map(rowHtml).join('') : empty}</div>
    ${soon.length ? `<h2 class="section-title">Coming up<span class="count num">${soon.length}</span></h2>
    <div class="group">${soon.map(rowHtml).join('')}</div>` : ''}
  </div>`;
}
function rowHtml(i) {
  const s = STATES[i.state] || STATES.unknown, [icon, tone] = LOOK[i.state] || LOOK.unknown;
  const lead = i.state === 'waiting'
    ? `<span class="ring" data-until="${i.until}"><span class="num">--</span></span>`
    : `<span class="tile ${tone}" aria-hidden="true"><i class="ti ${icon}"></i></span>`;
  let trail = `<i class="ti ti-chevron-right chev" aria-hidden="true"></i>`;
  if (i.approved && ['review', 'unverified', 'ready'].includes(i.state)) trail = `<span class="chip-ok">Approved</span>`;
  else if (i.state === 'review') trail = `<span class="btn filled small hit press" data-act="approve" data-row="${i.row}" role="button">Approve</span>`;
  else if (i.state === 'manual') trail = `<span class="btn tinted small hit press" data-act="open" data-row="${i.row}" role="button">Add ID</span>`;
  return `<button class="cell press-row ${tone}" data-act="open" data-row="${i.row}">
    ${lead}
    <span class="body">
      <span class="title"><span>${esc(i.name)}</span></span>
      <span class="sub">${esc(i.productName)}${i.qty > 1 ? ' ×' + i.qty : ''}, ${esc(i.city || 'no city')}</span>
      <span class="why"><b class="tone-text">${esc(s.label)}.</b> ${esc(i.reason || '')}</span>
    </span>${trail}</button>`;
}

function viewPlaced() {
  const q = S.query.trim().toLowerCase();
  const list = S.recent.filter(o => !q || [o.name, o.orderId, o.city, o.product, o.productName].join(' ').toLowerCase().includes(q));
  const groups = [];
  list.forEach(o => {
    const d = new Date(o.placedAt), k = isNaN(d) ? 'unknown' : dayKey(d);
    let g = groups[groups.length - 1];
    if (!g || g.k !== k) groups.push(g = { k, d, items: [], sum: 0 });
    g.items.push(o); g.sum += parseMoney(o.total);
  });
  const label = g => {
    if (g.k === 'unknown') return 'Earlier';
    if (g.k === dayKey(new Date())) return 'Today';
    if (g.k === dayKey(new Date(Date.now() - 86400000))) return 'Yesterday';
    return g.d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  };
  const body = !S.recentAt ? `<div class="group"><div class="empty"><span class="tile t-gray"><i class="ti ti-loader-2 spin"></i></span><div><b>Loading placed orders</b></div></div></div>`
    : !groups.length ? `<div class="group"><div class="empty"><span class="tile t-gray"><i class="ti ti-search"></i></span>
        <div><b>No matches</b><p>Try a surname or an Order ID like 1277076.</p></div></div></div>`
    : groups.map(g => `<h2 class="day-title"><span>${label(g)}</span><span class="num">${plural(g.items.length, 'order', 'orders')}${g.sum ? ', ' + money(g.sum) : ''}</span></h2>
      <div class="group">${g.items.map(o => {
        const d = new Date(o.placedAt);
        return `<button class="cell press-row" data-act="openplaced" data-id="${esc(o.orderId)}">
          <span class="tile t-green" aria-hidden="true"><i class="ti ti-check"></i></span>
          <span class="body"><span class="title"><span>${esc(o.name)}</span></span>
            <span class="sub">${isNaN(d) ? '' : d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + ', '}${esc(o.productName)}, ${esc(o.city)}</span></span>
          <span class="right"><span class="oid">${esc(o.orderId)}</span><span class="sub num">${o.total ? money(parseMoney(o.total)) : ''}</span></span>
        </button>`;
      }).join('')}</div>`).join('');
  return `<div class="px-safe">
    <h1 class="large-title" id="lt">Placed</h1>
    <label class="search"><i class="ti ti-search" aria-hidden="true"></i>
      <input type="search" id="q" placeholder="Name, Order ID or city" value="${esc(S.query)}" autocomplete="off" enterkeyhint="search"></label>
    ${errorBanner()}${body}</div>`;
}

function viewInsights() {
  const orders = S.recent.map(o => Object.assign({}, o, { d: new Date(o.placedAt), v: parseMoney(o.total) })).filter(o => !isNaN(o.d));
  if (!orders.length) return `<div class="px-safe"><h1 class="large-title" id="lt">Insights</h1>
    <div class="group" style="margin-top:16px"><div class="empty"><span class="tile t-gray"><i class="ti ti-chart-bar"></i></span>
    <div><b>No data yet</b><p>Insights appear once orders are placed.</p></div></div></div></div>`;
  const now = new Date(), start = d => { const x = new Date(now); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - d); return x; };
  const sumIn = from => orders.filter(o => o.d >= from).reduce((a, o) => ({ n: a.n + 1, v: a.v + o.v }), { n: 0, v: 0 });
  const t = sumIn(start(0)), w = sumIn(start(6)), m = sumIn(start(29));
  const days = [...Array(14)].map((_, i) => { const d = start(13 - i), k = dayKey(d);
    const os = orders.filter(o => dayKey(o.d) === k); return { d, n: os.length }; });
  const max = Math.max(1, ...days.map(d => d.n)), W = 600, H = 150, bw = W / 14;
  const svg = `<svg viewBox="0 0 ${W} ${H + 22}" role="img" aria-label="Orders per day, last 14 days">${days.map((d, i) => {
      const h = Math.max(d.n ? 4 : 1, (d.n / max) * H), x = i * bw + 6, isToday = i === 13;
      return `<rect x="${x}" y="${H - h}" width="${bw - 12}" height="${h}" rx="5" fill="${isToday ? 'var(--accent)' : 'var(--gray)'}" opacity="${isToday ? 1 : .45}"><title>${d.d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}: ${d.n} orders</title></rect>
        ${d.n ? `<text x="${x + (bw - 12) / 2}" y="${H - h - 5}" text-anchor="middle" class="axis">${d.n}</text>` : ''}
        ${i % 2 === 1 || isToday ? `<text x="${x + (bw - 12) / 2}" y="${H + 16}" text-anchor="middle" class="axis">${isToday ? 'Today' : d.d.getDate()}</text>` : ''}`;
    }).join('')}</svg>`;
  const top = key => { const c = {}; orders.filter(o => o.d >= start(29)).forEach(o => { const k = o[key] || '—'; c[k] = (c[k] || 0) + 1; });
    return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 6); };
  const bars = rows => { const mx = Math.max(1, ...rows.map(r => r[1]));
    return `<div class="group">${rows.map(([k, n]) => `<div class="bar-row"><span class="label">${esc(k)}</span><span class="val num">${n}</span>
      <span class="bar"><i style="width:${(n / mx) * 100}%"></i></span></div>`).join('')}</div>`; };
  return `<div class="px-safe">
    <h1 class="large-title" id="lt">Insights</h1>
    <div class="figures">
      <div class="fig"><div class="k">Today</div><div class="v num">${t.n}</div><div class="m num">${money(t.v)}</div></div>
      <div class="fig"><div class="k">7 days</div><div class="v num">${w.n}</div><div class="m num">${money(w.v)}</div></div>
      <div class="fig"><div class="k">30 days</div><div class="v num">${m.n}</div><div class="m num">${money(m.v)}</div></div>
    </div>
    <h2 class="section-title">Orders per day</h2><div class="group chart">${svg}</div>
    <h2 class="section-title">Top products</h2>${bars(top('productName'))}
    <h2 class="section-title">Top cities</h2>${bars(top('city'))}
    <p class="footnote">Last 30 days, from the latest ${plural(orders.length, 'order', 'orders')} in the sheet.</p></div>`;
}

function tickCountdowns() {
  const now = serverNow();
  document.querySelectorAll('.ring[data-until]').forEach(el => {
    const left = Number(el.dataset.until) - now;
    el.style.setProperty('--p', Math.max(0, Math.min(100, 100 - (left / quietMs()) * 100)).toFixed(1));
    el.querySelector('span').textContent = left > 0 ? clock(left) : 'now';
  });
}

// Nav bar: glass once content scrolls under it; compact title once the large title is gone
function updateNavState() {
  const v = $('#view'), nav = $('#nav'), lt = $('#lt');
  nav.classList.toggle('scrolled', v.scrollTop > 2);
  nav.classList.toggle('compact', !!lt && v.scrollTop > lt.offsetTop + lt.offsetHeight * 0.7);
}

// ── Tabs (direction-aware transition; tapping the active tab scrolls to top) ─
function goTab(tab) {
  const v = $('#view');
  if (tab === S.tab) { v.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const from = TABS.findIndex(t => t[0] === S.tab), to = TABS.findIndex(t => t[0] === tab);
  S.tab = tab; Haptics.select(); v.scrollTop = 0; render();
  const c = $('#content');
  c.classList.remove('in-left', 'in-right'); void c.offsetWidth;
  c.classList.add(to > from ? 'in-right' : 'in-left');
  if (tab !== 'queue' && Date.now() - S.recentAt > 30000) refreshRecent().then(render);
}

// ── Bottom sheets ────────────────────────────────────────────────────────────
const sheetHead = (title, sub) => `<div class="sheet-top"><div style="flex:1;min-width:0">
  <h3 id="sheet-title">${esc(title)}</h3>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}</div>
  <button class="close-btn hit" data-act="close" aria-label="Close"><i class="ti ti-x"></i></button></div>`;

const Sheet = {
  kind: null, row: null, resolve: null, lastFocus: null,
  open(kind, parts, opts) {
    const el = $('#sheet');
    this.kind = kind; this.row = (opts && opts.row) != null ? opts.row : null;
    el.innerHTML = `<div class="sheet-head" data-drag><div class="grabber"></div>${parts.head}</div>
      <div class="sheet-body">${parts.body || ''}</div><div class="sheet-foot">${parts.foot || ''}</div>`;
    el.style.setProperty('--drag', '0px');
    el.setAttribute('aria-hidden', 'false');
    this.lastFocus = document.activeElement;
    document.body.classList.add('sheet-open');
    setTimeout(() => { const c = el.querySelector('.close-btn'); c && c.focus({ preventScroll: true }); }, 90);
  },
  close(result) {
    if (!document.body.classList.contains('sheet-open')) return;
    document.body.classList.remove('sheet-open');
    $('#sheet').setAttribute('aria-hidden', 'true');
    const r = this.resolve; this.resolve = null; this.kind = null; this.row = null;
    if (r) r(!!result);
    if (this.lastFocus && this.lastFocus.focus) this.lastFocus.focus({ preventScroll: true });
  },
  refreshOrder() {
    const el = $('#sheet'), typing = el.contains(document.activeElement) && document.activeElement.tagName === 'INPUT';
    const i = items().find(x => x.row === this.row);
    if (!i) { if (!typing) { this.close(); toast('That order has left the queue.'); } return; }
    if (typing) return;                                   // never wipe what someone is typing
    const p = orderParts(i);
    el.querySelector('.sheet-body').innerHTML = p.body;
    el.querySelector('.sheet-foot').innerHTML = p.foot;
  }
};

// Confirmation as a bottom sheet (replaces centred alert popups); resolves true/false
function ask({ title, message, confirm, tone = 'filled', cancel = 'Cancel' }) {
  return new Promise(resolve => {
    Sheet.open('ask', { head: sheetHead(title), body: `<p class="ask-msg">${esc(message)}</p>`,
      foot: `<button class="btn block ${tone} press" data-act="ask-yes">${esc(confirm)}</button>
             <button class="btn block gray press" data-act="ask-no">${esc(cancel)}</button>` });
    Sheet.resolve = resolve;
  });
}

function kv(label, value, href, icon) {
  if (!value) return '';
  const inner = `<span class="tile t-gray" aria-hidden="true"><i class="ti ${icon}"></i></span>
    <span class="body kv"><span class="k">${label}</span><span class="v selectable ${href ? 'link' : ''}">${esc(value)}</span></span>`;
  return href ? `<a class="cell" href="${esc(href)}"${/^https?:/.test(href) ? ' target="_blank" rel="noopener"' : ''}>${inner}</a>` : `<div class="cell">${inner}</div>`;
}
function orderParts(i) {
  const s = STATES[i.state] || STATES.unknown, [, tone] = LOOK[i.state] || LOOK.unknown, st = S.status || {};
  const sheetRow = st.sheetUrl ? st.sheetUrl + '&range=A' + i.row : '';
  const prods = products(), parts = String(i.product || '').split('+').map(c => c.trim()).filter(Boolean);
  const whole = prods[String(i.product).trim()], links = whole ? [whole] : parts.map(c => prods[c]).filter(Boolean);
  const idField = `<div class="group" style="margin-top:14px"><label class="field"><span>Order ID from GjirafaMall</span>
    <input id="oid" inputmode="numeric" placeholder="e.g. 1277076" autocomplete="off"></label></div>`;
  let extra = '', foot = '';
  if (i.state === 'review' || i.state === 'ready') {
    const dup = /Same customer and product/.test(i.reason || '');
    foot = `${dup ? `<p class="warnline">Looks like a duplicate. Approve only if they ordered again.</p>` : ''}
      <button class="btn filled block press" data-act="approve" data-row="${i.row}" ${i.approved ? 'disabled' : ''}>${i.approved ? 'Approved, placing soon' : 'Approve and place'}</button>`;
  } else if (i.state === 'unverified') {
    extra = idField;
    foot = `<button class="btn gray block press" data-act="saveid" data-row="${i.row}">Save Order ID</button>
      <button class="btn danger block press" data-act="approve" data-row="${i.row}" data-strong="1" ${i.approved ? 'disabled' : ''}>Not in the back office, place it</button>`;
  } else if (i.state === 'manual') {
    extra = `<div class="group" style="margin-top:14px">${links.map(p => `<a class="cell" href="${esc(p.url)}" target="_blank" rel="noopener">
        <span class="tile t-blue"><i class="ti ti-external-link"></i></span><span class="body"><span class="title"><span>Open ${esc(p.code)} on GjirafaMall</span></span></span>
        <i class="ti ti-chevron-right chev"></i></a>`).join('')}</div>${idField}`;
    foot = `<button class="btn filled block press" data-act="saveid" data-row="${i.row}">Save Order ID</button>`;
  } else if (i.state === 'blocked' && sheetRow) {
    foot = `<a class="btn filled block press" href="${esc(sheetRow)}" target="_blank" rel="noopener"><i class="ti ti-table"></i>Fix it in the sheet</a>`;
  }
  const head = sheetHead(i.name, `${i.productName}${i.qty > 1 ? ' ×' + i.qty : ''}, ${i.city || 'no city'}`);
  const body = `<div class="status-card ${tone}"><div class="state">${esc(s.label)}</div><p>${esc(i.reason || '')}</p></div>
    <div class="group">
      ${kv('Phone', i.phone, i.phone ? 'tel:' + i.phone.replace(/[^\d+]/g, '') : '', 'ti-phone')}
      ${kv('Address', i.address, '', 'ti-map-pin')}
      ${kv('Comment', i.comment, '', 'ti-message')}
      ${kv('Product code', i.product, '', 'ti-package')}
      ${kv('Sheet', 'Row ' + i.row, sheetRow, 'ti-table')}
    </div>${extra}`;
  return { head, body, foot };
}
function openOrder(row) {
  const i = items().find(x => x.row === row); if (!i) return;
  haptic(); Sheet.open('order', orderParts(i), { row });
}
function openPlaced(id) {
  const o = S.recent.find(x => x.orderId === id); if (!o) return;
  const st = S.status || {}, d = new Date(o.placedAt);
  haptic();
  Sheet.open('placed', {
    head: sheetHead(o.name, `${o.productName}, ${o.city}`),
    body: `<div class="status-card t-green"><div class="state">Placed${isNaN(d) ? '' : ' ' + d.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</div>
      <p>Order ${esc(o.orderId)}${o.total ? ', ' + money(parseMoney(o.total)) + ' with transport' : ''}.</p></div>
      <div class="group">${kv('Order ID', o.orderId, '', 'ti-hash')}${kv('Product code', o.product, '', 'ti-package')}
      ${st.sheetUrl ? kv('Sheet', 'Row ' + o.row, st.sheetUrl + '&range=A' + o.row, 'ti-table') : ''}</div>`,
    foot: `<button class="btn filled block press" data-act="copy" data-text="${esc(o.orderId)}"><i class="ti ti-copy"></i>Copy Order ID</button>`
  });
}

// ── Gestures: drag a sheet down to dismiss; pull the list down to refresh ────
(function sheetDrag() {
  const el = $('#sheet');
  let y0 = null, dy = 0, t0 = 0, fromBody = false;
  el.addEventListener('touchstart', e => {
    const body = el.querySelector('.sheet-body'), inHead = !!e.target.closest('[data-drag]');
    fromBody = !inHead && !!body && body.contains(e.target) && body.scrollTop <= 0 && !e.target.closest('input');
    if (!inHead && !fromBody) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; t0 = Date.now();
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0) { if (fromBody) y0 = null; el.classList.remove('dragging'); el.style.setProperty('--drag', '0px'); return; }
    if (fromBody && e.cancelable) e.preventDefault();
    el.classList.add('dragging');
    el.style.setProperty('--drag', dy + 'px');
  }, { passive: false });
  el.addEventListener('touchend', () => {
    if (y0 == null) return;
    const velocity = dy / Math.max(1, Date.now() - t0);
    el.classList.remove('dragging'); y0 = null;
    if (dy > 120 || (dy > 30 && velocity > 0.6)) { haptic(); Sheet.close(false); }
    else el.style.setProperty('--drag', '0px');
  });
})();
(function pullToRefresh() {
  const v = $('#view');
  let y0 = null, armed = false;
  v.addEventListener('touchstart', e => { y0 = v.scrollTop <= 0 ? e.touches[0].clientY : null; armed = false; }, { passive: true });
  v.addEventListener('touchmove', e => {
    const p = $('#ptr'); if (y0 == null || !p) return;
    const dy = e.touches[0].clientY - y0;
    p.style.opacity = dy > 8 ? Math.min(1, dy / 72) : 0;
    p.style.transform = `rotate(${Math.min(dy, 110) * 3}deg)`;
    if (dy > 72 && !armed) { armed = true; Haptics.select(); }
  }, { passive: true });
  v.addEventListener('touchend', () => {
    const p = $('#ptr'); if (y0 == null) return;
    y0 = null; if (p) p.style.opacity = 0;
    if (armed) refresh(true);
    armed = false;
  });
  v.addEventListener('scroll', updateNavState, { passive: true });
})();

async function connect() {
  const key = ($('#key').value || '').trim(), err = $('#err');
  if (!key) { err.textContent = 'Paste the access key first.'; Haptics.warning(); return; }
  err.textContent = 'Checking…'; cfg = { key, url: cfg.url || DEFAULT_URL };
  try { await get('status'); store.set(cfg); S.error = ''; Haptics.success(); render(); refresh(true); }
  catch (e) {
    cfg.key = ''; Haptics.warning();
    err.textContent = e.message === 'The access key was rejected' ? 'That key was rejected. Copy it again from the setup log.' : e.message + '. Check the connection and try again.';
  }
}

// ── Events ───────────────────────────────────────────────────────────────────
document.addEventListener('touchstart', () => {}, { passive: true });   // lets :active styles fire on iOS
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, row = Number(el.dataset.row);
  if (act === 'tab') goTab(el.dataset.tab);
  else if (act === 'refresh') { haptic(); refresh(true); }
  else if (act === 'open') { e.preventDefault(); openOrder(row); }
  else if (act === 'approve') { e.stopPropagation(); if (Sheet.kind === 'order') Sheet.close(); approve(row, el.dataset.strong === '1'); }
  else if (act === 'saveid') saveOrderId(row);
  else if (act === 'close') Sheet.close(false);
  else if (act === 'ask-yes') { Haptics.tap(); Sheet.close(true); }
  else if (act === 'ask-no') Sheet.close(false);
  else if (act === 'copy') { navigator.clipboard && navigator.clipboard.writeText(el.dataset.text).then(() => { Haptics.success(); toast('Copied ' + el.dataset.text); }); }
  else if (act === 'push') enablePush();
  else if (act === 'pushoff') disablePush();
  else if (act === 'testpush') post('alert', { title: '🔔 Argati test', body: 'Notifications work on this device.' }).then(() => { Haptics.success(); toast('Test sent.'); }, err => toast(err.message));
  else if (act === 'saveconn') saveConnection();
  else if (act === 'connect') connect();
  else if (act === 'setting') saveSetting(el.dataset.key, Number(el.dataset.val));
  else if (act === 'openplaced') openPlaced(el.dataset.id);
});
document.addEventListener('change', e => { if (e.target.matches('[data-act="auto"]')) { haptic(); setAuto(e.target.checked, e.target); } });
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  S.query = e.target.value; const pos = e.target.selectionStart; render();
  const q = $('#q'); q.focus({ preventScroll: true }); q.setSelectionRange(pos, pos);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && Sheet.kind) Sheet.close(false);
  if (e.key === 'Enter' && e.target.id === 'key' && !cfg.key) connect();
  if (e.key === 'Enter' && e.target.id === 'oid' && Sheet.row != null) saveOrderId(Sheet.row);
});
$('#scrim').addEventListener('click', () => Sheet.close(false));
$('#content').addEventListener('animationend', () => $('#content').classList.remove('in-left', 'in-right'));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
setInterval(() => { if (document.visibilityState === 'visible' && !Sheet.kind) refresh(); }, POLL_MS);

if ('serviceWorker' in navigator && !DEMO) {

// ── Actions ────────────────────────────────────────────────────────────────
async function approve(row, strong) {
  const i = items().find(x => x.row === row); if (!i) return;
  if (strong && !(await ask({ title: 'Place this order again?', confirm: 'Place it again', tone: 'danger',
      message: `Only continue if ${i.name}'s order is NOT in the GjirafaMall back office. Otherwise the customer gets two orders.` }))) return;
  if (!strong && /Same customer and product/.test(i.reason || '') && !(await ask({ title: 'Order again for the same customer?',
      confirm: 'Approve anyway', message: `${i.name} already has an order for this product. Approve only if they really ordered again.` }))) return;
  haptic(); S.approved[row] = Date.now(); render();
  try { await post('approve', { row: i.row, product: i.product, phone: i.phone }); Haptics.success(); toast('Approved. It will be placed within a minute.'); }
  catch (e) { delete S.approved[row]; render(); Haptics.warning(); toast('Approval didn’t go through: ' + e.message); }
}
async function saveOrderId(row) {
  const i = items().find(x => x.row === row); const v = (($('#oid') || {}).value || '').replace(/\D/g, '');
  if (!i) return;
  if (v.length < 5) { Haptics.warning(); toast('Enter the Order ID number, e.g. 1277076'); return; }
  haptic();
  try {
    await post('setOrderId', { row: i.row, product: i.product, phone: i.phone, first: i.first, last: i.last, orderId: v });
    Haptics.success(); toast(`Saved #${v} to row ${i.row}.`); Sheet.close(); refresh(true);
  } catch (e) { Haptics.warning(); toast('Couldn’t save: ' + e.message); }
}
async function setAuto(on, input) {
  const wait = fmtWait(((S.status || {}).settings || {}).quietSeconds);
  if (on && !(await ask({ title: 'Turn on automatic ordering?', confirm: 'Turn on',
      message: `Clean orders will be placed ${wait} after the last edit, without asking.` }))) { input.checked = false; return; }
  try { await post('setAuto', { on }); S.status.autoMode = on; toast(on ? 'Automatic ordering is on.' : 'Automatic ordering is paused.'); render(); }
  catch (e) { input.checked = !on; toast('Couldn’t change it: ' + e.message); }
}
async function saveConnection() {
  const key = ($('#key').value || '').trim(), url = ($('#url').value || '').trim() || DEFAULT_URL;
  const prev = cfg; cfg = { key, url };
  try { await get('status'); store.set(cfg); toast('Connected.'); refresh(true); }
  catch (e) { cfg = prev; toast(e.message); }
}

// ── Notifications + service worker ─────────────────────────────────────────
function fmtWait(sec) { sec = Number(sec) || 120; return sec % 60 ? sec + ' seconds' : plural(sec / 60, 'minute', 'minutes'); }
async function saveSetting(key, val) {
  const prev = Object.assign({}, (S.status || {}).settings);
  if (S.status) S.status.settings = Object.assign({}, prev, { [key]: val });
  if (S.pending) S.pending.settings = Object.assign({}, S.pending.settings, { [key]: val });
  haptic(); render();
  try { await post('setSettings', { [key]: val }); toast('Saved. The runner uses it on its next check.'); }
  catch (e) { if (S.status) S.status.settings = prev; render(); toast('Couldn’t save: ' + e.message); }
}
async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub) { await post('unsubscribe', { endpoint: sub.endpoint }); await sub.unsubscribe(); }
    pushOff = true; toast('Notifications are off on this device.'); refresh(true);
  } catch (e) { toast('Couldn’t turn them off: ' + e.message); }
}
let pushOff = false;
function pushState() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    return { can: false, text: isIOS && !standalone ? 'On iPhone, add Argati to the Home Screen first (Share, Add to Home Screen).' : 'This browser can’t receive notifications.' };
  }
  const p = Notification.permission;
  if (p === 'denied') return { can: false, text: 'Blocked. Allow notifications for Argati in the device settings.' };
  const on = p === 'granted' && !pushOff;
  return { can: true, on, text: on ? 'On. Orders, problems and runner alerts arrive here.' : 'Off. Turn on to get order and runner alerts.' };
}
function b64ToBytes(b64) { const pad = '='.repeat((4 - b64.length % 4) % 4), raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); }
async function enablePush() {
  if (DEMO) { toast('Notifications are off in the demo.'); return; }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications weren’t allowed.'); render(); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    await post('subscribe', { subscription: sub.toJSON() }); pushOff = false;
    toast('Notifications are on for this device.'); render();
  } catch (e) { toast('Couldn’t turn on notifications: ' + e.message); }
}
function tellWorker() {
  if (DEMO || !navigator.serviceWorker || !navigator.serviceWorker.controller) return;
  navigator.serviceWorker.controller.postMessage({ type: 'config', url: cfg.url, key: cfg.key });
}
